<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Code Generator - STOCKFABLE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- ★ QR Code Generation Library ★ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; width: 100%; overflow: hidden; }
        
        /* ★ গোলাপি এবং সবুজ সরাসরি মিশ্রিত ব্যাকগ্রাউন্ড ★ */
        body {
            background: linear-gradient(135deg, #ec4899 0%, #10b981 100%);
            display: flex; justify-content: center; align-items: center; color: #1e293b;
            padding: 15px; /* ★ আশেপাশে স্পেস (Tyle) ★ */
        }
        
        /* ★ সাইজ পারফেক্ট করা হয়েছে ★ */
        .container {
            width: 100%; max-width: 420px; 
            height: 100%; max-height: 780px;
            display: flex; flex-direction: column; padding: 22px;
            background: #ffffff; /* সাদা কার্ড */
            border-radius: 24px; 
            border: 2px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.3);
            overflow-y: auto;
        }
        .container::-webkit-scrollbar { width: 5px; }
        .container::-webkit-scrollbar-thumb { background: #ec4899; border-radius: 10px; }

        /* হেডার */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 20px; padding-bottom: 12px;
            border-bottom: 2px solid #f1f5f9;
        }
        .header h2 { font-size: 18px; font-weight: 700; color: #0f172a; display: flex; align-items: center; gap: 8px; }
        .header h2 i { color: #ec4899; }
        .back-btn {
            background: #f1f5f9; border: 1px solid #e2e8f0;
            color: #475569; padding: 6px 12px; border-radius: 10px; font-size: 13px;
            cursor: pointer; display: flex; align-items: center; gap: 6px;
            text-decoration: none; transition: all 0.2s ease;
        }
        .back-btn:hover { background: #e2e8f0; color: #0f172a; }

        /* ইনপুট সেকশন */
        .input-group {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 16px; padding: 15px;
            display: flex; flex-direction: column; gap: 8px;
            margin-bottom: 15px; transition: all 0.3s ease;
        }
        .input-group:focus-within { 
            border-color: #10b981; 
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.15);
            background: #ffffff;
        }
        .input-group label { font-size: 12px; color: #64748b; font-weight: 600; }
        .input-group input {
            background: transparent; border: none; outline: none;
            color: #0f172a; font-size: 15px; width: 100%;
        }
        .input-group input::placeholder { color: #94a3b8; }

        /* সেটিংস রো */
        .settings-row {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
            margin-bottom: 15px;
        }
        .setting-group {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 14px; padding: 10px 14px;
            display: flex; flex-direction: column; gap: 4px;
        }
        .setting-group label { font-size: 11px; color: #64748b; font-weight: 600; }
        .setting-group select, .setting-group input[type="color"] {
            background: transparent; border: none; outline: none;
            color: #0f172a; font-size: 13px; cursor: pointer;
            width: 100%; height: 28px;
        }
        .setting-group select option { background: #ffffff; color: #0f172a; }

        /* অ্যাকশন বাটন */
        .action-btn {
            width: 100%; background: linear-gradient(135deg, #ec4899, #10b981); 
            color: #fff; border: none; border-radius: 14px; padding: 16px; 
            font-size: 15px; font-weight: 600; cursor: pointer; 
            display: flex; justify-content: center; align-items: center; gap: 8px; 
            transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
            margin-bottom: 15px;
        }
        .action-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4); }
        .action-btn:active { transform: scale(0.98); }

        /* QR রেজাল্ট সেকশন */
        .qr-result {
            display: none; flex-direction: column; align-items: center;
            gap: 15px; padding: 10px 0;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* ★ QR কোডের সাইজ ফিক্স ★ */
        #qrCodeBox {
            background: #ffffff; padding: 12px; border-radius: 16px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border: 1px solid #e2e8f0;
            width: 100%; max-width: 250px; /* যাতে QR কোড বেশি বড় না হয়ে যায় */
            aspect-ratio: 1 / 1;
        }
        #qrCodeBox canvas, #qrCodeBox img {
            max-width: 100% !important;
            height: auto !important;
            border-radius: 8px;
        }
        
        .download-btn {
            width: 100%; background: #10b981; color: #ffffff;
            border: none; border-radius: 14px; padding: 15px;
            font-size: 15px; font-weight: 600; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
        }
        .download-btn:hover { background: #059669; transform: translateY(-2px); }
        .download-btn:active { transform: scale(0.98); }

    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2><i class="fas fa-qrcode"></i> QR Generator</h2>
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
        </div>

        <!-- ইনপুট এরিয়া -->
        <div class="input-group">
            <label>Enter Text or URL</label>
            <input type="text" id="qrText" placeholder="https://example.com" autocomplete="off">
        </div>

        <!-- সেটিংস -->
        <div class="settings-row">
            <div class="setting-group">
                <label>Size</label>
                <select id="qrSize">
                    <option value="200">200 x 200</option>
                    <option value="300" selected>300 x 300</option>
                    <option value="400">400 x 400</option>
                </select>
            </div>
            <div class="setting-group">
                <label>Color</label>
                <input type="color" id="qrColor" value="#000000">
            </div>
        </div>

        <!-- জেনারেট বাটন -->
        <button class="action-btn" onclick="generateQR()">
            <i class="fas fa-magic"></i> Generate QR Code
        </button>

        <!-- রেজাল্ট এরিয়া -->
        <div class="qr-result" id="qrResult">
            <div id="qrCodeBox"></div>
            <button class="download-btn" onclick="downloadQR()">
                <i class="fas fa-download"></i> Download QR Code
            </button>
        </div>
    </div>

    <script>
        let qrCodeInstance = null;

        function generateQR() {
            const text = document.getElementById('qrText').value.trim();
            const size = parseInt(document.getElementById('qrSize').value);
            const color = document.getElementById('qrColor').value;
            const qrBox = document.getElementById('qrCodeBox');
            const resultSection = document.getElementById('qrResult');

            // ভ্যালিডেশন
            if (!text) {
                alert("⚠️ অনুগ্রহ করে কিছু টেক্সট বা লিংক লিখুন!");
                return;
            }

            // আগের QR কোড মুছে ফেলা
            qrBox.innerHTML = '';

            // ★ নতুন QR কোড তৈরি করা ★
            qrCodeInstance = new QRCode(qrBox, {
                text: text,
                width: size,
                height: size,
                colorDark: color,
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            // রেজাল্ট সেকশন দেখানো
            resultSection.style.display = 'flex';
        }

        function downloadQR() {
            const canvas = document.querySelector('#qrCodeBox canvas');
            const img = document.querySelector('#qrCodeBox img');
            let url = '';

            if (canvas) {
                url = canvas.toDataURL("image/png");
            } else if (img) {
                url = img.src;
            }

            if (!url) {
                alert("❌ QR কোড ডাউনলোড করা যাচ্ছে না। আবার চেষ্টা করুন।");
                return;
            }

            const downloadLink = document.createElement('a');
            downloadLink.href = url;
            downloadLink.download = "QR_Code_" + Date.now() + ".png";
            
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }

        document.getElementById('qrText').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') generateQR();
        });
    </script>
</body>
</html>
