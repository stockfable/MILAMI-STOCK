<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minami Stock - Upload</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        /* ================= Base Styles ================= */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        body { background-color: #f4f4f4; color: #333; font-size: 13px; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* Main Layout */
        .main-container { display: flex; flex: 1; overflow: hidden; background-color: #fff; }
        
        /* Left Side: Image Grid */
        .grid-area { flex: 1; padding: 20px; overflow-y: auto; background-color: #f4f4f4; position: relative; }
        .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        
        /* Image Card Selection Styling */
        .image-card { background-color: #fff; border: 2px solid #ddd; border-radius: 4px; overflow: hidden; position: relative; transition: all 0.2s; cursor: pointer; }
        .image-card:hover { box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .image-card.selected { border-color: #1473e6; box-shadow: 0 0 0 2px rgba(20,115,230,0.3); }
        .image-card .checkmark { position: absolute; top: 5px; right: 5px; background: #1473e6; color: #fff; width: 20px; height: 20px; border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 12px; z-index: 2; }
        .image-card.selected .checkmark { display: flex; }
        
        .image-thumbnail { width: 100%; height: 100px; background-color: #e0e0e0; background-size: cover; background-position: center; }
        .image-info { padding: 6px; display: flex; justify-content: space-between; font-size: 11px; color: #777; background-color: #fafafa; border-top: 1px solid #eee; }

        /* Right Side: Sidebar Form */
        .sidebar { width: 380px; background-color: #fff; border-left: 1px solid #ddd; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; flex-shrink: 0; }
        
        .form-group { display: flex; flex-direction: column; gap: 6px; position: relative; }
        .form-group label { font-weight: 700; font-size: 11px; color: #444; text-transform: uppercase; }
        .form-group select, .form-group input[type="text"], .form-group textarea { padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; outline: none; width: 100%; background-color: #fff; }
        .form-group select:focus, .form-group input:focus, .form-group textarea:focus { border-color: #1473e6; }
        .form-group textarea { resize: vertical; min-height: 60px; }

        /* Keyword Suggestion Dropdown */
        .suggestion-box { position: absolute; top: 100%; left: 0; width: 100%; background: #fff; border: 1px solid #ccc; border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-height: 150px; overflow-y: auto; display: none; z-index: 100; }
        .suggestion-item { padding: 8px 10px; cursor: pointer; font-size: 13px; }
        .suggestion-item:hover { background: #f0f7ff; color: #1473e6; }

        .sidebar-actions { display: flex; gap: 10px; margin-top: 10px; padding-top: 15px; border-top: 1px solid #eee; flex-wrap: wrap; }
        .btn-clear { padding: 10px; border: 1px solid #ccc; background-color: #fff; border-radius: 4px; cursor: pointer; flex: 1; font-weight: 600; }
        .btn-save-work { padding: 10px; border: 1px solid #1473e6; background-color: #fff; color: #1473e6; border-radius: 4px; cursor: pointer; flex: 1; font-weight: 600; }
        .btn-submit { padding: 10px; border: none; background-color: #1473e6; color: white; border-radius: 4px; cursor: pointer; flex: 2; font-weight: 600; }
        
        .btn-release { padding: 8px; border: 1px solid #fbbf24; background-color: #fffbeb; color: #b45309; border-radius: 4px; cursor: pointer; font-weight: 600; width: 100%; display: flex; align-items: center; justify-content: center; gap: 5px; margin-top: 5px; }

        /* Loading Spinner */
        .loader-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.7); z-index: 10; justify-content: center; align-items: center; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #1473e6; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Release Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center; }
        .modal-box { background: #fff; padding: 25px; border-radius: 8px; width: 90%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .modal-box h3 { margin-bottom: 15px; font-size: 18px; }
        .modal-box .form-group { margin-bottom: 15px; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        .modal-actions button { padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: 600; }
        .modal-actions .btn-cancel { border: 1px solid #ccc; background: #fff; }
        .modal-actions .btn-confirm { border: none; background: #1473e6; color: #fff; }
    </style>
</head>
<body>

    <div id="site-topbar"></div>

    <div class="main-container">
        <!-- Left Side: Image Grid -->
        <div class="grid-area">
            <div class="loader-overlay" id="loaderOverlay">
                <div class="spinner"></div>
            </div>
            
            <div class="image-grid" id="imageGrid">
                <p style="color: #777; grid-column: 1 / -1; text-align: center; margin-top: 50px;" id="noFilesMsg">No files yet. Upload your first file to get started.</p>
            </div>
        </div>

        <!-- Right Side: Sidebar Form -->
        <div class="sidebar">
            
            <div class="preview-box" id="previewBox" onclick="document.getElementById('fileInput').click()" style="border: 2px dashed #ccc; padding: 20px; text-align: center; cursor: pointer; border-radius: 4px;">
                <div class="placeholder-text">
                    <i class="fas fa-cloud-upload-alt" style="font-size: 24px; color: #1473e6;"></i>
                    <p style="margin-top: 5px;">Click to select images (Multiple allowed)</p>
                </div>
            </div>
            <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">

            <div class="form-group">
                <label>FILE TYPE</label>
                <select id="fileType">
                    <option value="Photo">Photo</option>
                    <option value="Illustration">Illustration</option>
                    <option value="Vector">Vector</option>
                </select>
            </div>

            <div class="form-group">
                <label>CATEGORY *</label>
                <select id="category">
                    <option value="">Select category</option>
                    <option value="Travel">Travel</option>
                    <option value="Nature">Nature</option>
                    <option value="Business">Business</option>
                    <option value="Technology">Technology</option>
                    <option value="Food">Food</option>
                </select>
            </div>

            <!-- Title with Suggestion -->
            <div class="form-group">
                <label>TITLE *</label>
                <input type="text" id="title" placeholder="Enter title" autocomplete="off">
                <div class="suggestion-box" id="titleSuggestions"></div>
            </div>

            <div class="form-group">
                <label>DESCRIPTION</label>
                <textarea id="description" placeholder="Short description..."></textarea>
            </div>

            <div class="form-group">
                <label>KEYWORDS (COMMA SEPARATED)</label>
                <input type="text" id="keywords" placeholder="e.g. road, sky, travel, nature">
            </div>

            <button class="btn-release" id="releaseBtn" onclick="openReleaseModal()">
                <i class="fas fa-file-signature"></i> Add Release Document
            </button>

            <div class="sidebar-actions">
                <button class="btn-clear" onclick="clearForm()">Clear</button>
                <button class="btn-save-work" id="saveWorkBtn">Save Work</button>
                <button class="btn-submit" id="submitBtn">Submit File</button>
            </div>
        </div>
    </div>

    <div id="ms-footer"></div>

    <!-- Release Modal -->
    <div class="modal-overlay" id="releaseModal">
        <div class="modal-box">
            <h3>Add Release Document</h3>
            <p style="margin-bottom: 15px; color: #666;">If your image contains a recognizable person or property, please attach a signed release form.</p>
            
            <div class="form-group">
                <label>Release Type</label>
                <select id="releaseType">
                    <option value="Model">Model Release</option>
                    <option value="Property">Property Release</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Document Name / ID</label>
                <input type="text" id="releaseName" placeholder="e.g. John Doe - Signed 2026">
            </div>

            <div class="form-group">
                <label>Upload Release File (PDF/Image)</label>
                <input type="file" id="releaseFile" accept=".pdf,image/*">
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeReleaseModal()">Cancel</button>
                <button class="btn-confirm" onclick="saveReleaseLocally()">Attach</button>
            </div>
        </div>
    </div>

    <!-- Firebase Configuration -->
    <script>
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const storage = firebase.storage();
        const db = firebase.firestore();
    </script>

    <script src="top-bar.js"></script>
    <script src="site-footer.js"></script>

    <!-- Custom Upload Logic -->
    <script>
        let selectedFiles = []; 
        let activeImageIndex = -1; // কোন ছবিটি সিলেক্ট করা আছে
        let releaseData = null;

        // ১. ফাইল সিলেক্ট করলে বাম দিকে থাম্বনেইল দেখানো
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            selectedFiles = selectedFiles.concat(files); 
            renderGrid(); 
            document.getElementById('fileInput').value = ''; 
            
            // যদি কোনো ছবি সিলেক্ট করা না থাকে, তবে প্রথম ছবিটি অটো সিলেক্ট হবে
            if (activeImageIndex === -1 && selectedFiles.length > 0) {
                selectImage(0);
            }
        });

        // গ্রিড রেন্ডার করার ফাংশন
        function renderGrid() {
            const grid = document.getElementById('imageGrid');
            const noFilesMsg = document.getElementById('noFilesMsg');
            
            if (selectedFiles.length > 0 && noFilesMsg) noFilesMsg.style.display = 'none';

            grid.innerHTML = '';
            if(noFilesMsg) grid.appendChild(noFilesMsg);

            selectedFiles.forEach((file, index) => {
                const objectUrl = URL.createObjectURL(file);
                const card = document.createElement('div');
                card.className = `image-card ${index === activeImageIndex ? 'selected' : ''}`;
                card.setAttribute('data-index', index);
                card.onclick = () => selectImage(index); // ক্লিক করলে সিলেক্ট হবে
                
                card.innerHTML = `
                    <div class="checkmark"><i class="fas fa-check"></i></div>
                    <div class="image-thumbnail" style="background-image: url('${objectUrl}');"></div>
                    <div class="image-info">
                        <span>${file.name.substring(0, 10)}...</span>
                        <span>📷 Photo</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // ২. ছবিতে ক্লিক করলে অটো টাইটেল এবং ক্যাটাগরি বসানো (Mock AI Scan)
        function selectImage(index) {
            activeImageIndex = index;
            renderGrid(); // আবার রেন্ডার করে সিলেক্টেড বর্ডার দেখানো

            const file = selectedFiles[index];
            const fileName = file.name.split('.').slice(0, -1).join('.'); // এক্সটেনশন বাদ দেওয়া

            // অটো টাইটেল সেট করা
            const titleInput = document.getElementById('title');
            titleInput.value = fileName.replace(/[-_]/g, ' ').replace(/\b\w/g, l => l.toUpperCase());

            // মক AI স্ক্যান (ফাইলের নামের উপর ভিত্তি করে ক্যাটাগরি সিলেক্ট করা)
            simulateAIScan(fileName);
        }

        function simulateAIScan(fileName) {
            const lowerName = fileName.toLowerCase();
            const categorySelect = document.getElementById('category');
            
            // সাধারণ কী-ওয়ার্ড ম্যাচিং (আসল AI-এর জন্য API লাগবে)
            if (lowerName.includes('nature') || lowerName.includes('tree') || lowerName.includes('sky') || lowerName.includes('mountain')) {
                categorySelect.value = 'Nature';
            } else if (lowerName.includes('business') || lowerName.includes('office') || lowerName.includes('meeting')) {
                categorySelect.value = 'Business';
            } else if (lowerName.includes('food') || lowerName.includes('fruit') || lowerName.includes('cook')) {
                categorySelect.value = 'Food';
            } else if (lowerName.includes('tech') || lowerName.includes('computer') || lowerName.includes('code')) {
                categorySelect.value = 'Technology';
            } else {
                // যদি কিছু না মেলে, র‍্যান্ডম একটি সিলেক্ট করে দেবে
                const options = ['Travel', 'Nature', 'Business', 'Technology', 'Food'];
                categorySelect.value = options[Math.floor(Math.random() * options.length)];
            }

            // কীওয়ার্ড সাজেশনও এখানে ট্রিগার করা যেতে পারে
            suggestKeywords(titleInput.value);
        }

        // ৩. টাইটেল ইনপুটে টাইপ করলে কীওয়ার্ড সাজেশন দেখানো
        const titleInput = document.getElementById('title');
        const suggestionBox = document.getElementById('titleSuggestions');
        
        const keywordDatabase = {
            'road': ['highway', 'asphalt', 'travel', 'landscape', 'sky'],
            'nature': ['green', 'tree', 'forest', 'outdoor', 'environment'],
            'business': ['office', 'meeting', 'corporate', 'work', 'professional'],
            'technology': ['computer', 'digital', 'code', 'innovation', 'future'],
            'food': ['delicious', 'meal', 'cooking', 'fresh', 'restaurant'],
            'travel': ['vacation', 'journey', 'destination', 'tourism', 'adventure']
        };

        titleInput.addEventListener('input', function() {
            suggestKeywords(this.value);
        });

        function suggestKeywords(text) {
            const words = text.toLowerCase().split(' ');
            let suggestions = new Set();
            
            words.forEach(word => {
                if (keywordDatabase[word]) {
                    keywordDatabase[word].forEach(k => suggestions.add(k));
                }
            });

            if (suggestions.size > 0) {
                suggestionBox.innerHTML = '';
                suggestions.forEach(k => {
                    const div = document.createElement('div');
                    div.className = 'suggestion-item';
                    div.textContent = k;
                    div.onclick = () => {
                        const keywordInput = document.getElementById('keywords');
                        const currentKeywords = keywordInput.value ? keywordInput.value.split(',').map(k => k.trim()) : [];
                        if (!currentKeywords.includes(k)) {
                            currentKeywords.push(k);
                            keywordInput.value = currentKeywords.join(', ');
                        }
                        suggestionBox.style.display = 'none';
                    };
                    suggestionBox.appendChild(div);
                });
                suggestionBox.style.display = 'block';
            } else {
                suggestionBox.style.display = 'none';
            }
        }

        // ক্লিক আউট করলে সাজেশন বক্স লুকানো
        document.addEventListener('click', function(e) {
            if (!titleInput.contains(e.target) && !suggestionBox.contains(e.target)) {
                suggestionBox.style.display = 'none';
            }
        });

        // ৪. আপলোড করার মূল ফাংশন
        async function uploadFiles(isDraft) {
            if (selectedFiles.length === 0) {
                alert("Please select at least one image!");
                return;
            }
            
            const title = document.getElementById('title').value.trim();
            const category = document.getElementById('category').value;
            const fileType = document.getElementById('fileType').value;
            const description = document.getElementById('description').value.trim();
            const keywordsStr = document.getElementById('keywords').value.trim();
            
            if (!title || !category) {
                alert("Title and Category are required!");
                return;
            }

            const keywordsArray = keywordsStr ? keywordsStr.split(',').map(k => k.trim()) : [];
            const status = isDraft ? 'draft' : 'published';

            const loader = document.getElementById('loaderOverlay');
            loader.style.display = 'flex';

            try {
                // এখানে শুধু সিলেক্টেড ছবিটি আপলোড হবে (অথবা চাইলে সবগুলো লুপ করে করা যাবে)
                // আমরা আপাতত সবগুলো আপলোড করছি
                const uploadPromises = selectedFiles.map(async (file) => {
                    const storageRef = storage.ref(`stock_photos/${Date.now()}_${file.name}`);
                    const snapshot = await storageRef.put(file);
                    const downloadURL = await snapshot.ref.getDownloadURL();

                    return db.collection('photos').add({
                        title: title,
                        category: category,
                        fileType: fileType,
                        description: description,
                        keywords: keywordsArray,
                        imageUrl: downloadURL,
                        status: status,
                        releaseAttached: releaseData ? true : false,
                        releaseInfo: releaseData,
                        uploadedBy: firebase.auth().currentUser ? firebase.auth().currentUser.uid : 'anonymous',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                });

                await Promise.all(uploadPromises);
                alert(isDraft ? "✅ সফলভাবে ড্রাফট হিসেবে সেভ হয়েছে!" : "✅ সফলভাবে পাবলিশ হয়েছে!");
                clearForm();

            } catch (error) {
                console.error("Error uploading: ", error);
                alert("❌ আপলোড ব্যর্থ: " + error.message);
            } finally {
                loader.style.display = 'none';
            }
        }

        document.getElementById('saveWorkBtn').addEventListener('click', () => uploadFiles(true));
        document.getElementById('submitBtn').addEventListener('click', () => uploadFiles(false));

        function clearForm() {
            selectedFiles = [];
            activeImageIndex = -1;
            releaseData = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('title').value = '';
            document.getElementById('category').value = '';
            document.getElementById('description').value = '';
            document.getElementById('keywords').value = '';
            
            const grid = document.getElementById('imageGrid');
            grid.innerHTML = '<p style="color: #777; grid-column: 1 / -1; text-align: center; margin-top: 50px;" id="noFilesMsg">No files yet. Upload your first file to get started.</p>';
        }

        // Release Modal Functions
        function openReleaseModal() { document.getElementById('releaseModal').style.display = 'flex'; }
        function closeReleaseModal() { document.getElementById('releaseModal').style.display = 'none'; }
        function saveReleaseLocally() {
            const type = document.getElementById('releaseType').value;
            const name = document.getElementById('releaseName').value.trim();
            if (!name) { alert("Please enter a name or ID for the release."); return; }
            releaseData = { type: type, name: name };
            alert(`✅ Release Attached: ${type} - ${name}`);
            closeReleaseModal();
        }
    </script>
</body>
</html>
