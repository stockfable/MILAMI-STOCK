<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found — MINAMI STOCK</title>
<meta name="color-scheme" content="light only">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root{
    --ink:#111827;--mute:#6b7280;--line:#e5e7eb;--bg:#fff;--soft:#f7f7f7;
    --blue:#1473e6;--blue-d:#0d66d0;--purple:#7c5cff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:#fff}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
    background:#fff;color:var(--ink);line-height:1.55;
    min-height:100vh;display:flex;flex-direction:column;
  }
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
  #ms-footer{width:100%}
  a{color:inherit;text-decoration:none}
  button{font:inherit;cursor:pointer;color:inherit}

  .wrap{max-width:640px;text-align:center;width:100%}

  .error-code{
    font-size:clamp(80px,18vw,160px);font-weight:900;line-height:1;
    background:linear-gradient(135deg,#1473e6,#0d66d0,#7c5cff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    letter-spacing:-2px;margin-bottom:8px;
  }

  .illustration{
    font-size:80px;margin-bottom:16px;line-height:1;
    animation:float 3s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-12px)}
  }

  h1{font-size:26px;font-weight:800;margin-bottom:12px;color:#111827}
  p.sub{
    font-size:15px;color:#6b7280;line-height:1.7;
    margin-bottom:28px;max-width:460px;margin-left:auto;margin-right:auto;
  }

  .actions{
    display:flex;gap:10px;justify-content:center;
    flex-wrap:wrap;margin-bottom:36px;
  }
  .btn{
    padding:12px 24px;border-radius:24px;font-weight:700;font-size:14px;
    border:1px solid #e5e7eb;background:#fff;color:#111827;
    display:inline-flex;align-items:center;gap:8px;
    transition:.15s;text-decoration:none;
  }
  .btn:hover{background:#f7f7f7;transform:translateY(-2px);border-color:#1473e6}
  .btn.primary{background:#1473e6;border-color:#1473e6;color:#fff}
  .btn.primary:hover{background:#0d66d0;border-color:#0d66d0}

  /* Quick links */
  .quick-links{
    background:#f7f7f7;border:1px solid #e5e7eb;
    border-radius:16px;padding:26px;
  }
  .quick-links h3{
    font-size:12px;text-transform:uppercase;letter-spacing:.6px;
    color:#6b7280;font-weight:800;margin-bottom:16px;
  }
  .link-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:10px;
  }
  .link-grid a{
    background:#fff;border:1px solid #e5e7eb;border-radius:10px;
    padding:14px 10px;font-size:13px;font-weight:600;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    transition:.15s;color:#111827;text-decoration:none;
  }
  .link-grid a:hover{
    border-color:#1473e6;color:#1473e6;
    transform:translateY(-2px);
    box-shadow:0 6px 16px rgba(20,115,230,.12);
  }
  .link-grid i{font-size:20px;color:#1473e6}

  @media(max-width:600px){
    .actions{flex-direction:column;align-items:stretch}
    .btn{justify-content:center}
    .quick-links{padding:20px}
  }

  /* Force light for shared top-bar & footer */
  @media (prefers-color-scheme: dark){
    body,html{background:#fff !important;color:#111827 !important}
    .msf.msf-dark{
      background:#f5f5f5 !important;color:#222 !important;
      --msf-mute:#6e6e6e !important;--msf-line:#dcdcdc !important;
      --msf-btn:#fff !important;
    }
    header.top-nav{background:#fff !important;color:#111827 !important;border-bottom-color:#e1e1e1 !important}
  }
</style>
</head>
<body>

<!-- TOP BAR (auto inject by top-bar.js) -->
<div id="site-topbar"></div>

<main>
  <div class="wrap">
    <div class="illustration">🔍</div>
    <div class="error-code">404</div>
    <h1>Page not found</h1>
    <p class="sub" id="errorMsg">
      The page you're looking for doesn't exist, has been moved, or the URL is incorrect.
      Let's get you back on track.
    </p>

    <div class="actions">
      <a href="index.html" class="btn primary">
        <i class="fas fa-home"></i> Go home
      </a>
      <button class="btn" onclick="history.back()">
        <i class="fas fa-arrow-left"></i> Go back
      </button>
      <button class="btn" onclick="reportMissing()">
        <i class="fas fa-flag"></i> Report
      </button>
    </div>

    <div class="quick-links">
      <h3>Popular destinations</h3>
      <div class="link-grid">
        <a href="stock-photo.html"><i class="fas fa-images"></i> Stock Photos</a>
        <a href="tools.html"><i class="fas fa-th-large"></i> All Tools</a>
        <a href="image-cropper.html"><i class="fas fa-crop"></i> Cropper</a>
        <a href="image-compressor.html"><i class="fas fa-compress"></i> Compressor</a>
        <a href="image-resizer.html"><i class="fas fa-expand"></i> Resizer</a>
        <a href="bg-remover.html"><i class="fas fa-magic"></i> BG Remover</a>
        <a href="color-palette.html"><i class="fas fa-eye-dropper"></i> Palette</a>
        <a href="contact.html"><i class="fas fa-envelope"></i> Contact</a>
      </div>
    </div>
  </div>
</main>

<!-- FOOTER (auto inject by site-footer.js) -->
<div id="ms-footer"></div>

<div id="toast" style="position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:11px 20px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99999"></div>

<!-- ============ FIREBASE SDK ============ -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<!-- ============ SHARED SCRIPTS ============ -->
<script src="top-bar.js"></script>
<script src="site-footer.js"></script>

<!-- ============ 404 LOGIC ============ -->
<script>
/* ============================================================
   FIREBASE CONFIG — আপনার আগের config এখানে বসান
   (top-bar.js এ যেটা use করছেন, সেটাই)
   ============================================================ */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

/* ============================================================
   Toast
   ============================================================ */
function toast(msg) {
  const t = document.getElementById("toast");
  if (!t) return;
  t.textContent = msg;
  t.style.opacity = "1";
  t.style.transform = "translateX(-50%)";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => {
    t.style.opacity = "0";
    t.style.transform = "translateX(-50%) translateY(20px)";
  }, 2200);
}

/* ============================================================
   Show missing URL in message
   ============================================================ */
(function () {
  const path = location.pathname + location.search;
  const el = document.getElementById("errorMsg");
  if (el && path && path !== "/") {
    el.innerHTML =
      'The page <b style="color:#1473e6;word-break:break-all">' +
      escapeHtml(path) +
      '</b> doesn\'t exist, has been moved, or the URL is incorrect.';
  }
})();

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

/* ============================================================
   Auth state — top-bar handles the UI, we just log here
   ============================================================ */
auth.onAuthStateChanged(user => {
  if (user) {
    console.log("[404] Signed in as:", user.email);
  } else {
    console.log("[404] Guest visitor");
  }
});

/* ============================================================
   Report missing page
   ============================================================ */
async function reportMissing() {
  const path = location.pathname + location.search;

  // If user signed in → save to Firestore
  if (auth.currentUser && window.firebase && firebase.firestore) {
    try {
      await firebase.firestore().collection("reports").add({
        type: "404",
        url: path,
        referrer: document.referrer || "",
        userAgent: navigator.userAgent,
        userId: auth.currentUser.uid,
        userEmail: auth.currentUser.email || "",
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      toast("✅ Report sent. Thank you!");
      return;
    } catch (e) {
      console.warn("Firestore save failed:", e);
    }
  }

  // Guest → fallback: mailto
  const subject = encodeURIComponent("Broken link report");
  const body = encodeURIComponent(
    "Page not found: " + path +
    "\nReferrer: " + (document.referrer || "direct") +
    "\nPlease fix this link."
  );
  window.location.href = "mailto:support@minamistock.com?subject=" + subject + "&body=" + body;
  toast("📧 Opening mail client...");
}
</script>

</body>
</html>
