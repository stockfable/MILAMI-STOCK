<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINAMI STOCK - Age Calculator & Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* General Reset */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        /* Pure Black Background */
        body {
            background-color: #000000;
            color: #e5e7eb;
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
        }

        /* Main Content Wrapper */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }

        /* Age Calculator Card */
        .main-container {
            width: 100%; 
            background: #121212; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            padding: 40px; 
            border: 1px solid #333;
            margin-bottom: 40px;
        }

        .main-title {
            text-align: center; font-size: 26px; font-weight: 700;
            color: #ffffff; margin-bottom: 30px; line-height: 1.3;
        }

        /* Tabs */
        .tabs {
            display: flex; gap: 5px; margin-bottom: 20px;
            background: #1e1e1e; padding: 5px; border-radius: 8px; width: max-content;
            border: 1px solid #333;
        }
        .tab {
            padding: 8px 16px; font-size: 13px; font-weight: 500;
            color: #9ca3af; cursor: pointer; border-radius: 6px;
        }
        .tab.active { background: #333; color: #ffffff; font-weight: 600; }

        /* Input Section */
        .input-wrapper {
            background: #1e1e1e; border: 1px solid #333;
            border-radius: 8px; padding: 25px; margin-bottom: 20px;
        }
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .input-group label { font-size: 12px; font-weight: 600; color: #9ca3af; text-transform: uppercase; }
        .input-group input {
            width: 100%; padding: 12px 15px; border: 1px solid #444;
            background: #000; color: #fff; border-radius: 6px; font-size: 15px; outline: none;
        }
        .input-group input:focus { border-color: #fbbf24; box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.2); }
        .input-group input::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }

        .button-row { display: flex; justify-content: flex-end; }
        .calc-btn {
            background-color: #fbbf24; color: #000; border: none;
            padding: 12px 24px; border-radius: 6px; font-size: 15px;
            font-weight: 700; cursor: pointer; transition: 0.2s;
        }
        .calc-btn:hover { background-color: #f59e0b; }

        /* Results Section */
        .results-section {
            display: none; background: #0f172a; border: 1px solid #1e3a8a;
            border-radius: 8px; padding: 20px; margin-top: 20px;
        }
        .results-title { font-size: 16px; font-weight: 600; color: #93c5fd; margin-bottom: 15px; text-align: center; }
        .result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 15px; text-align: center; }
        .res-box { background: #1e293b; padding: 15px; border-radius: 8px; border: 1px solid #334155; }
        .res-box .value { display: block; font-size: 24px; font-weight: 700; color: #fbbf24; }
        .res-box .label { font-size: 12px; color: #94a3b8; text-transform: uppercase; font-weight: 600; }

        /* ★ 10 Family Images Gallery ★ */
        .gallery-section {
            width: 100%;
            margin-top: 10px;
        }
        .gallery-title {
            font-size: 22px; color: #ffffff; margin-bottom: 20px;
            text-align: center; font-weight: 600;
        }
        .image-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr); /* 5 images per row on desktop */
            gap: 15px;
        }
        .image-box {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #333;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .image-box img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }
        .image-box:hover {
            transform: scale(1.05);
            border-color: #fbbf24;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .image-grid { grid-template-columns: repeat(3, 1fr); } /* 3 per row on tablet */
        }
        @media (max-width: 600px) {
            .main-container { padding: 20px; }
            .main-title { font-size: 22px; }
            .button-row { justify-content: center; }
            .calc-btn { width: 100%; }
            .image-grid { grid-template-columns: repeat(2, 1fr); } /* 2 per row on mobile */
        }
    </style>
</head>
<body>

    <!-- আপনার দেওয়া টপ বার এখানে লোড হবে -->
    <div id="site-topbar"></div>

    <!-- মেইন কন্টেন্ট এরিয়া -->
    <div class="main-wrapper">
        
        <!-- এজ ক্যালকুলেটর -->
        <main class="main-container">
            <h1 class="main-title">Determine Your Precise Age: Years, Months, and Days</h1>

            <div class="tabs">
                <div class="tab active">Calculate Age</div>
                <div class="tab">Future Date</div>
            </div>

            <div class="input-wrapper">
                <div class="input-group">
                    <label>ENTER YOUR DATE OF BIRTH</label>
                    <input type="date" id="dobInput">
                </div>
                <div class="button-row">
                    <button class="calc-btn" onclick="calculateAge()">Calculate Now</button>
                </div>
            </div>

            <div class="results-section" id="resultsSection">
                <div class="results-title">Your Calculated Age Breakdown</div>
                <div class="result-grid">
                    <div class="res-box">
                        <span class="value" id="yearsResult">0</span>
                        <span class="label">Years</span>
                    </div>
                    <div class="res-box">
                        <span class="value" id="monthsResult">0</span>
                        <span class="label">Months</span>
                    </div>
                    <div class="res-box">
                        <span class="value" id="daysResult">0</span>
                        <span class="label">Days</span>
                    </div>
                    <div class="res-box">
                        <span class="value" id="hoursResult">0</span>
                        <span class="label">Hours</span>
                    </div>
                </div>
            </div>
        </main>

        <!-- ★ ১০টি ফ্যামিলি ছবি (দাদা-দাদি, নাতি-নাতনি) ★ -->
        <section class="gallery-section">
            <h2 class="gallery-title">Family Milestones & Generations</h2>
            <div class="image-grid">
                <!-- Image 1 -->
                <div class="image-box"><img src="https://images.unsplash.com/photo-1516307365426-bea591f05011?q=80&w=400&auto=format&fit=crop" alt="Grandparents"></div>
                <!-- Image 2 -->
                <div class="image-box"><img src="https://images.unsplash.com/photo-1511895426328-dc8714191300?q=80&w=400&auto=format&fit=crop" alt="Family"></div>
                <!-- Image 3 -->
                <div class="image-box"><img src="https://images.unsplash.com/photo-1596040033229-a9821ebd058d?q=80&w=400&auto=format&fit=crop" alt="Grandfather and Grandson"></div>
                <!-- Image 4 -->
                <div class="image-box"><img src="https://images.unsplash.com/photo-1581373449483-0151b6f6e51b?q=80&w=400&auto=format&fit=crop" alt="Grandmother and Granddaughter"></div>
                <!-- Image 5 -->
                <div class="image-box"><img src="https://images.unsplash.com/photo-1531983412531-1f49a365ffed?q=80&w=400&auto=format&fit=crop" alt="Parents and Baby"></div>
                <!-- Image 6 -->
                <div class="image-box"><img src="https://images.unsplash.com/photo-1609220136736-443140cffec6?q=80&w=400&auto=format&fit=crop" alt="Big Family"></div>
                <!-- Image 7 -->
                <div class="image-box"><img src="https://images.unsplash.com/photo-1542336391-ae2936dcbbf7?q=80&w=400&auto=format&fit=crop" alt="Elderly Couple"></div>
                <!-- Image 8 -->
                <div class="image-box"><img src="https://images.unsplash.com/photo-1502086223501-7ea6ecd79368?q=80&w=400&auto=format&fit=crop" alt="Grandparents with grandchild"></div>
                <!-- Image 9 -->
                <div class="image-box"><img src="https://images.unsplash.com/photo-1503454537195-1dcabb73ffb9?q=80&w=400&auto=format&fit=crop" alt="Kids"></div>
                <!-- Image 10 -->
                <div class="image-box"><img src="https://images.unsplash.com/photo-1476703993599-0035a21b17a9?q=80&w=400&auto=format&fit=crop" alt="Family Hands"></div>
            </div>
        </section>

    </div>

    <!-- আপনার দেওয়া ফুটার এখানে লোড হবে -->
    <div id="ms-footer"></div>

    <!-- আপনার দেওয়া জাভাস্ক্রিপ্ট ফাইল দুটো -->
    <script src="top-bar.js"></script>
    <script src="site-footer.js"></script>

    <!-- এজ ক্যালকুলেটর এর জাভাস্ক্রিপ্ট -->
    <script>
        function calculateAge() {
            const dobInput = document.getElementById('dobInput').value;
            
            if (!dobInput) {
                alert("Please enter your Date of Birth to calculate.");
                return;
            }

            const dob = new Date(dobInput);
            const today = new Date();

            if (dob > today) {
                alert("Error: Your date of birth cannot be in the future.");
                return;
            }

            let years = today.getFullYear() - dob.getFullYear();
            let months = today.getMonth() - dob.getMonth();
            let days = today.getDate() - dob.getDate();

            if (days < 0) {
                months--;
                const prevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
                days += prevMonth.getDate();
            }

            if (months < 0) {
                years--;
                months += 12;
            }

            let hours = today.getHours() - dob.getHours();
            if (hours < 0) hours += 24;

            document.getElementById('yearsResult').innerText = years;
            document.getElementById('monthsResult').innerText = months;
            document.getElementById('daysResult').innerText = days;
            document.getElementById('hoursResult').innerText = hours;

            document.getElementById('resultsSection').style.display = 'block';
        }
    </script>
</body>
</html>
