<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Photos - MINAMI STOCK</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--ink:#222;--mute:#6e6e6e;--line:#e1e1e1;--bg:#fff;--soft:#f5f5f5;--blue:#1473e6;--blue-d:#0d66d0}
body.dark{--ink:#f1f1f1;--mute:#a3a3a3;--line:#333;--bg:#161616;--soft:#222}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
header.top-nav{border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:30}
.top-nav .in{max-width:1400px;margin:auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:18px}
.nav-left{display:flex;align-items:center;gap:16px;min-width:0}
.sidebar-bottom-menu{position:relative}
.sidebar-trigger{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.sidebar-trigger:hover{background:var(--soft)}
.sidebar-dropdown{display:none;position:absolute;top:48px;left:0;min-width:210px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 12px 30px rgba(0,0,0,.14);z-index:40}
.sidebar-dropdown.show{display:block}
.sidebar-dropdown a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:6px;font-size:14px;font-weight:600}
.sidebar-dropdown a:hover{background:var(--soft)}
.sidebar-dropdown a.active{background:var(--soft);box-shadow:inset 3px 0 var(--blue)}
.sidebar-dropdown i{width:18px;text-align:center;color:var(--mute)}
.logo-container{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;white-space:nowrap}
.site-logo{width:34px;height:34px;object-fit:contain}
.nav-links-top{display:flex;gap:2px;margin-left:6px}
.nav-links-top a{padding:8px 12px;border-radius:6px;font-size:15px;font-weight:600}
.nav-links-top a:hover{background:var(--soft)}
.nav-links-top a i{margin-right:6px;font-size:12px}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.shop-logo-btn{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:20px;font-weight:700;font-size:14px;border:1px solid var(--line)}
.shop-logo-btn:hover{background:var(--soft)}
.auth-buttons{display:flex;align-items:center;gap:8px}
.btn-account{font-size:26px;color:var(--mute);display:grid;place-items:center}
.btn-signin,.btn-signup,.btn{border:1px solid var(--ink);background:var(--bg);padding:8px 18px;border-radius:20px;font-weight:700;font-size:14px;display:inline-block;text-align:center}
.btn-signup,.btn.fill{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-signup:hover,.btn.fill:hover{background:var(--blue-d)}
.btn-signin:hover,.btn:hover{background:var(--soft)}
.account-wrapper{display:none;position:relative}
.account-avatar{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--soft);display:grid;place-items:center;overflow:hidden;font-weight:700;font-size:15px;padding:0}
.account-avatar:hover{border-color:var(--blue)}
.account-avatar img,.account-avatar-large img{width:100%;height:100%;object-fit:cover}
.account-dropdown{display:none;position:absolute;right:0;top:46px;width:270px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 14px 34px rgba(0,0,0,.16);z-index:50}
.account-dropdown.show{display:block}
.account-header{display:flex;align-items:center;gap:12px;padding:10px}
.account-avatar-large{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:18px;overflow:hidden;flex:none}
.account-info{min-width:0;flex:1}
.account-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.account-email{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.account-divider{height:1px;background:var(--line);margin:6px 4px}
.account-menu-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;background:none;border-radius:8px;font-size:14px;font-weight:600;text-align:left}
.account-menu-item:hover{background:var(--soft)}
.account-menu-item i{width:18px;text-align:center;color:var(--mute)}
.cap{padding:7px 9px 8px;font-size:12px;line-height:1.3;color:var(--mute);background:var(--bg)}
.hero{background:var(--bg);padding:44px 20px 26px;border-bottom:1px solid var(--line)}
.hero .in{max-width:900px;margin:auto}
.hero h1{font-size:clamp(26px,4.4vw,42px);font-weight:800;line-height:1.12;margin-bottom:20px}
.search{display:flex;background:var(--bg);border:2px solid var(--ink);border-radius:6px;overflow:hidden}
.search select{border:0;border-right:1px solid var(--line);padding:0 14px;font:inherit;font-size:14px;background:var(--soft);color:var(--ink);max-width:170px}
.search input{flex:1;border:0;padding:15px;font-size:16px;min-width:0;background:var(--bg);color:var(--ink)}
.search input:focus{outline:none}
.search button{border:0;background:var(--blue);color:#fff;padding:0 26px;font-weight:700;font-size:15px}
.search button:hover{background:var(--blue-d)}
.trend{margin-top:14px;font-size:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.trend span{color:var(--mute)}
.trend button{background:var(--soft);border:0;padding:5px 12px;border-radius:14px;font-size:13px}
.trend button:hover{background:var(--line)}
.filters{border-bottom:1px solid var(--line);background:var(--bg)}
.filters .in{max-width:1400px;margin:auto;padding:12px 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--bg);padding:7px 14px;border-radius:18px;font-size:14px;font-weight:600}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters .count{margin-left:auto;color:var(--mute);font-size:14px}
.filters select{border:1px solid var(--line);border-radius:18px;padding:7px 12px;font:inherit;font-size:14px;background:var(--bg);color:var(--ink)}
main{max-width:1400px;margin:auto;padding:22px 20px 40px;background:var(--bg)}
.grid{columns:4 260px;column-gap:14px}
.card{break-inside:avoid;margin-bottom:14px;position:relative;border-radius:4px;overflow:hidden;background:var(--soft);cursor:zoom-in}
.card img{width:100%;display:block;min-height:120px;object-fit:cover;background:#eee}
.card .ov{position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.65));opacity:0;transition:opacity .15s;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;color:#fff}
.card:hover .ov,.card:focus-within .ov{opacity:1}
.ov b{font-size:14px;line-height:1.25}
.ov small{opacity:.85;font-size:12px;margin-top:2px}
.card .tools{position:absolute;top:10px;right:10px;display:flex;gap:6px;opacity:0;transition:opacity .15s}
.card:hover .tools,.card:focus-within .tools{opacity:1}
.round{width:34px;height:34px;border-radius:50%;border:0;background:#fff;color:#222;display:grid;place-items:center;font-size:16px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.round.saved{background:#e34ba9;color:#fff}
.badge-free{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.72);color:#fff;font-size:10px;padding:3px 8px;border-radius:10px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;z-index:2}
.state{padding:70px 10px;text-align:center;color:var(--mute)}
.state h2{color:var(--ink);font-size:22px;margin-bottom:8px}
.state .btn{margin-top:18px}
.more{display:block;margin:10px auto 0}

/* ================= Adobe Stock style lightbox ================= */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:60;display:none;align-items:center;justify-content:center;padding:20px;overflow:auto}
.lb.open{display:flex}
.lb .box{background:var(--bg);border-radius:8px;max-width:1300px;width:100%;max-height:94vh;display:grid;grid-template-columns:1fr 380px;overflow:hidden;position:relative}
.lb .pic{background:#0a0a0a;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;min-height:400px;overflow:hidden}
.lb .pic img{max-width:100%;max-height:85vh;object-fit:contain;cursor:zoom-in;transition:transform .25s;user-select:none}
.lb .pic img.zoomed{cursor:zoom-out;transform:scale(1.7)}
.lb .side{padding:26px 24px;overflow:auto;font-size:14px}
.lb h3{font-size:19px;margin-bottom:10px;line-height:1.35;font-weight:600}
.author-line{font-size:13px;color:var(--mute);margin-bottom:18px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.author-line b{color:var(--ink);font-weight:600}
.author-line .dot{opacity:.4}
.src-pill{background:var(--soft);padding:2px 9px;border-radius:10px;font-size:11px;font-weight:600;color:var(--ink)}
.quick-actions{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.qa-btn{border:1px solid var(--line);background:var(--bg);padding:7px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer}
.qa-btn:hover{background:var(--soft);border-color:var(--ink)}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-bottom:18px;padding:14px;background:var(--soft);border-radius:8px}
.info-grid > div{display:flex;flex-direction:column;min-width:0}
.info-grid label{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;font-weight:700}
.info-grid span{font-size:13px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lic-pick{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.lic-opt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:8px;padding:11px 12px;cursor:pointer;transition:.15s}
.lic-opt:hover{border-color:var(--mute)}
.lic-opt.active{border-color:var(--blue);background:#f0f7ff}
.lic-opt input{margin:0;accent-color:var(--blue)}
.lic-opt > div{flex:1;min-width:0}
.lic-opt b{display:block;font-size:13px;margin-bottom:2px}
.lic-opt small{color:var(--mute);font-size:11px;line-height:1.35}
.lic-price{font-weight:700;font-size:13px;color:var(--blue);white-space:nowrap}
.download-btn{width:100%;padding:12px;font-size:15px;text-align:center;margin-bottom:8px;border-radius:8px;display:block;text-decoration:none}
.save-btn{width:100%;padding:11px;font-size:14px;border-radius:8px;margin-bottom:20px}
.kw-section{margin-bottom:16px}
.kw-label{display:block;font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;font-weight:700}
.lb .kw{margin:0;display:flex;flex-wrap:wrap;gap:6px}
.lb .kw span{background:var(--soft);padding:4px 10px;border-radius:12px;font-size:12px;cursor:pointer;transition:.15s}
.lb .kw span:hover{background:var(--ink);color:var(--bg)}
.lb .meta{font-size:12px;color:var(--mute);line-height:1.7;padding-top:14px;border-top:1px solid var(--line)}
.lb .x{position:absolute;top:14px;right:18px;background:rgba(0,0,0,.5);border:0;color:#fff;font-size:30px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;z-index:5}
.lb .x:hover{background:rgba(0,0,0,.85)}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:11px 20px;border-radius:6px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:90}
#toast.show{opacity:1;transform:translateX(-50%)}

@media(max-width:900px){.nav-links-top,.shop-logo-btn span{display:none}}
@media(max-width:820px){
  .search select{display:none}
  .btn-signin{display:none}
  .lb{padding:0}
  .lb .box{grid-template-columns:1fr;max-height:100vh;border-radius:0;height:100vh}
  .lb .pic{min-height:45vh;max-height:50vh;padding:10px}
  .lb .pic img{max-height:45vh}
  .lb .side{padding:18px 16px}
  .info-grid{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAzWwbk-Dh1Kzzp9CvNyqC28ToCWXw41Qs",
  authDomain: "creoverse-stock.firebaseapp.com",
  databaseURL: "https://creoverse-stock-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "creoverse-stock",
  storageBucket: "creoverse-stock.firebasestorage.app",
  messagingSenderId: "128072247505",
  appId: "1:128072247505:web:47e58c3a140f4e858bbdf0"
};

/* ================================================================
   🔑 PIXABAY KEY — Pixabay থেকে rotate করে নতুন key এখানে বসান
   ================================================================ */
const PIXABAY_KEY = "YOUR_PIXABAY_KEY_HERE";
/* ================================================================ */

const PHOTO_COLLECTION = "stockphoto";
const DATA_COLLECTION  = "photoData";
const FREE_LIMIT = 60;

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const $ = id => document.getElementById(id);
const PAGE = 40;
let all = [], view = [], shown = 0, cat = "", term = "", user = null, saved = new Set(), current = null;
let currentQuery = "food";

function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2200)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function kwList(p){return Array.isArray(p.keywords)?p.keywords:String(p.keywords||"").split(",").map(s=>s.trim()).filter(Boolean)}

/* account menu */
$("avatarBtn").onclick = e => { e.stopPropagation(); $("acctDrop").classList.toggle("show"); };
$("logoutBtn").onclick = () => auth.signOut().then(() => { $("acctDrop").classList.remove("show"); toast("Signed out"); });
document.addEventListener("click", e => { if (!$("userBox").contains(e.target)) $("acctDrop").classList.remove("show"); });
$("appsBtn").onclick = e => { e.stopPropagation(); $("appsDrop").classList.toggle("show"); };
document.addEventListener("click", e => { if (!$("sidebarMenu").contains(e.target)) $("appsDrop").classList.remove("show"); });

/* ===== Auth state ===== */
auth.onAuthStateChanged(async u => {
  user = u;
  if (u) {
    const n = u.displayName || (u.email||"U").split("@")[0];
    $("guestBox").style.display = "none"; $("userBox").style.display = "block";
    $("ddName").textContent = n; $("ddEmail").textContent = u.email || "";
    const initial = esc(n[0].toUpperCase());
    const face = u.photoURL ? '<img alt="" src="'+esc(u.photoURL)+'">' : initial;
    $("avatarBtn").innerHTML = face; $("ddAv").innerHTML = face;
    try {
      const s = await db.collection("users").doc(u.uid).collection("saved").get();
      saved = new Set(s.docs.map(d=>d.id));
    } catch(e){ saved = new Set(); }
  } else {
    saved = new Set();
    $("guestBox").style.display = "flex"; $("userBox").style.display = "none"; $("acctDrop").classList.remove("show");
  }
  render(true);
});

/* ============================================================
   Mix of queries: food + nature + wildlife + more
   ============================================================ */
const QUERY_POOL = [
  // Food
  "burger","pizza","cake","ice cream","coffee","sushi","pasta","salad",
  "sandwich","dessert","chocolate","breakfast","fruit","vegetables","noodles",
  // Nature
  "nature","forest","mountain","ocean","lake","sunset","sunrise","waterfall",
  "flower","beach","desert","autumn","spring","snow","sky","clouds",
  // Wildlife
  "wildlife","tiger","lion","elephant","owl","eagle","deer","fox","bear",
  "wolf","parrot","flamingo","butterfly","dolphin","penguin","panda"
];
function randomQuery(){ return QUERY_POOL[Math.floor(Math.random()*QUERY_POOL.length)]; }

/* ============================================================
   PIXABAY
   ============================================================ */
async function fetchPixabay(query, count = 30) {
  if (!PIXABAY_KEY || PIXABAY_KEY === "YOUR_PIXABAY_KEY_HERE") {
    console.warn("PIXABAY_KEY not set");
    return [];
  }
  try {
    const url = "https://pixabay.com/api/?key=" + encodeURIComponent(PIXABAY_KEY)
      + "&q=" + encodeURIComponent(query)
      + "&per_page=" + Math.min(count, 200)
      + "&image_type=photo"
      + "&safesearch=true"
      + "&lang=en";
    const r = await fetch(url);
    if (!r.ok) throw new Error("Pixabay HTTP " + r.status);
    const d = await r.json();
    return (d.hits || []).map(p => ({
      id: "pixabay_" + p.id,
      title: (p.tags || "").split(",")[0].trim() || query,
      url: p.webformatURL,
      fullUrl: p.largeImageURL,
      thumb: p.previewURL,
      author: p.user,
      authorUrl: "https://pixabay.com/users/" + p.user + "-" + p.user_id + "/",
      category: guessCategory(query),
      subCategory: query,
      keywords: (p.tags || "").split(",").map(s => s.trim()).filter(Boolean),
      source: "Pixabay",
      license: "Pixabay License (free, commercial OK, no attribution)",
      free: true,
      width: p.imageWidth,
      height: p.imageHeight
    }));
  } catch(e) {
    console.warn("Pixabay fail:", e.message);
    return [];
  }
}

function guessCategory(q) {
  q = q.toLowerCase();
  if (/burger|pizza|cake|food|coffee|sushi|pasta|salad|dessert|chocolate|fruit|vegetable|noodle|breakfast/.test(q)) return "Food";
  if (/tiger|lion|elephant|owl|eagle|deer|fox|bear|wolf|wildlife|animal|parrot|flamingo|butterfly|dolphin|penguin|panda/.test(q)) return "Wildlife";
  if (/forest|mountain|ocean|lake|sunset|sunrise|waterfall|flower|beach|desert|autumn|spring|snow|sky|cloud|nature/.test(q)) return "Nature";
  return "Photos";
}

const pixCache = new Map();
async function fetchPixabayCached(query, count = 30) {
  const k = query + "|" + count;
  if (pixCache.has(k)) return pixCache.get(k);
  const data = await fetchPixabay(query, count);
  pixCache.set(k, data);
  return data;
}

/* ===== Load photos ===== */
async function load(){
  $("state").hidden = false; $("state").innerHTML = "Loading photos...";

  let mine = [];
  try {
    const snap = await db.collection(PHOTO_COLLECTION).orderBy("createdAt","desc").limit(300).get();
    mine = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .filter(p => p.url || p.imageId)
      .map(p => ({ ...p, free: false, source: "MINAMI" }));
  } catch(e) { console.error("Firebase load error:", e); }

  currentQuery = randomQuery();
  const free = await fetchPixabayCached(currentQuery, FREE_LIMIT);

  all = [...mine, ...free];

  if (!all.length) {
    $("state").innerHTML = '<h2>No photos yet</h2>'
      + '<p style="margin:10px 0">Check that PIXABAY_KEY is set, or upload your own photos.</p>'
      + '<a class="btn fill" href="upload.html">Upload a photo</a>';
    return;
  }

  buildCategories();
  apply();
}

function buildCategories(){
  const cats = [...new Set(all.map(p=>p.category).filter(Boolean))].sort();
  $("catSel").innerHTML = '<option value="">All categories</option>' + cats.map(c=>'<option>'+esc(c)+'</option>').join("");
  $("chips").innerHTML = '<button class="chip on" data-c="">All</button>'
    + cats.slice(0,10).map(c=>'<button class="chip" data-c="'+esc(c)+'">'+esc(c)+'</button>').join("");
  $("chips").querySelectorAll(".chip").forEach(b => b.onclick = () => setCat(b.dataset.c));

  const freq = {};
  all.forEach(p => kwList(p).forEach(k => { k=k.toLowerCase(); freq[k]=(freq[k]||0)+1; }));
  const top = Object.keys(freq).sort((a,b)=>freq[b]-freq[a]).slice(0,7);
  $("trend").innerHTML = top.length ? '<span>Popular:</span>' : '';
  top.forEach(k => {
    const b=document.createElement("button");
    b.textContent=k;
    b.onclick=()=>{ $("q").value=k; term=k; apply(); };
    $("trend").appendChild(b);
  });
}

function setCat(c){
  cat = c; $("catSel").value = c;
  $("chips").querySelectorAll(".chip").forEach(b => b.classList.toggle("on", b.dataset.c === c));
  apply();
}

function apply(){
  const t = term.toLowerCase();
  view = all.filter(p => {
    if (cat && p.category !== cat) return false;
    if (!t) return true;
    return (p.title||"").toLowerCase().includes(t)
        || (p.author||"").toLowerCase().includes(t)
        || (p.subCategory||"").toLowerCase().includes(t)
        || kwList(p).some(k=>k.toLowerCase().includes(t));
  });
  const s = $("sort").value;
  const ms = p => p.createdAt && p.createdAt.toMillis ? p.createdAt.toMillis() : 0;
  if (s==="old") view.sort((a,b)=>ms(a)-ms(b));
  else if (s==="az") view.sort((a,b)=>(a.title||"").localeCompare(b.title||""));
  else view.sort((a,b)=>ms(b)-ms(a));
  $("count").textContent = view.length + (view.length===1?" photo":" photos");
  render(true);
}

function render(reset){
  const g = $("grid");
  if (reset){ g.innerHTML=""; shown=0; }
  if (!view.length){
    g.innerHTML="";
    $("state").hidden=false; $("more").hidden=true;
    $("state").innerHTML = all.length
      ? '<h2>No photos match your search</h2>Try a different keyword or category.'
      : '<h2>No photos yet</h2>Be the first to share a photo on MINAMI STOCK.<br><a class="btn fill" href="upload.html">Upload a photo</a>';
    return;
  }
  $("state").hidden = true;
  const next = view.slice(shown, shown+PAGE);
  next.forEach(p => g.appendChild(cardEl(p)));
  shown += next.length;
  $("more").hidden = shown >= view.length;
}

const imgCache = {};
function getImg(p){
  if (p.url) return Promise.resolve(p.url);
  if (!imgCache[p.id]) imgCache[p.id] = db.collection(DATA_COLLECTION).doc(p.imageId).get()
    .then(d => { p.url = d.exists ? d.data().data : ""; return p.url; })
    .catch(() => "");
  return imgCache[p.id];
}
const io = "IntersectionObserver" in window ? new IntersectionObserver(es => {
  es.forEach(e => { if (e.isIntersecting){ io.unobserve(e.target); const img=e.target, p=img._p; getImg(p).then(u => { if (u) img.src = u; else img.closest(".card")?.remove(); }); } });
}, {rootMargin:"300px"}) : null;

function cardEl(p){
  const d = document.createElement("div");
  d.className = "card"; d.tabIndex = 0;
  const badge = p.free ? '<span class="badge-free">'+esc(p.source||"FREE")+'</span>' : '';
  d.innerHTML = '<img loading="lazy" alt="'+esc(p.title||"Photo")+'"'+(p.url?' src="'+esc(p.url)+'"':'')+'>'
    + badge
    + '<div class="tools"><button class="round'+(saved.has(p.id)?' saved':'')+'" title="Save" aria-label="Save">&#9825;</button></div>'
    + '<div class="ov"><b>'+esc(p.title||"Untitled")+'</b><small>'+esc(p.author||"")+'</small></div>'
    + '<div class="cap">'+(p.tag?esc(p.tag)+' ':'')+esc(p.title||"Untitled")+'</div>';
  const im = d.querySelector("img");
  if (!p.url){ im._p = p; if (io) io.observe(im); else getImg(p).then(u => im.src = u); }
  d.onclick = e => { if (e.target.closest(".round")) return; openLb(p); };
  d.onkeydown = e => { if (e.key==="Enter") openLb(p); };
  d.querySelector(".round").onclick = e => { e.stopPropagation(); toggleSave(p, e.currentTarget); };
  return d;
}

async function toggleSave(p, btn){
  if (!user){ toast("Sign in to save photos"); setTimeout(()=>location.href="login.html",900); return; }
  const ref = db.collection("users").doc(user.uid).collection("saved").doc(p.id);
  try {
    if (saved.has(p.id)){ await ref.delete(); saved.delete(p.id); toast("Removed from collection"); }
    else {
      await ref.set({
        title: p.title || "",
        url: (p.url && p.url.length < 2000) ? p.url : "",
        imageId: p.imageId || "",
        source: p.source || "",
        free: !!p.free,
        savedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      saved.add(p.id); toast("Saved to collection");
    }
    if (btn) btn.classList.toggle("saved", saved.has(p.id));
    if (current && current.id===p.id) $("lbSave").textContent = saved.has(p.id) ? "♥ Saved — Remove" : "♡ Save to collection";
  } catch(e){ console.error(e); toast("Could not save. Check Firestore rules."); }
}

/* ===== Adobe Stock style Lightbox ===== */
function openLb(p){
  current = p;

  $("lbImg").src = p.url || "";
  $("lbImg").alt = p.title || "";
  $("lbImg").classList.remove("zoomed");
  if (!p.url) getImg(p).then(u => { if (current === p) { $("lbImg").src = u; $("lbDl").href = u; } });

  $("lbT").textContent = p.title || "Untitled";
  $("lbAuthor").textContent = p.author || "Unknown";
  $("lbSource").textContent = p.source || (p.free ? "Free" : "MINAMI");

  $("lbDim").textContent = (p.width && p.height) ? (p.width + " × " + p.height + " px") : "—";
  $("lbType").textContent = (p.fileType || "JPEG").replace("image/", "").toUpperCase();
  $("lbCat").textContent = p.category || "—";
  $("lbSub").textContent = p.subCategory || p.tag || p.ctype || "Photo";

  $("lbDl").href = p.fullUrl || p.url || "#";
  $("lbDl").setAttribute("download", (p.title || "minami-stock").replace(/\s+/g, "-") + ".jpg");
  $("lbSave").textContent = saved.has(p.id) ? "♥ Saved — Remove" : "♡ Save to collection";

  const kws = kwList(p).slice(0, 30);
  $("lbKw").innerHTML = kws.length
    ? kws.map(k => '<span data-kw="' + esc(k) + '">' + esc(k) + '</span>').join("")
    : '<span style="opacity:.5">No keywords</span>';
  $("lbKw").querySelectorAll("span[data-kw]").forEach(s => {
    s.onclick = () => {
      $("q").value = s.dataset.kw;
      term = s.dataset.kw;
      closeLb();
      apply();
    };
  });

  const when = p.createdAt && p.createdAt.toDate ? p.createdAt.toDate().toLocaleDateString() : "";
  $("lbMeta").innerHTML =
      (p.license ? '📄 ' + esc(p.license) + '<br>' : '')
    + (when ? '📅 Added ' + esc(when) + '<br>' : '')
    + '🆔 ' + esc(p.id);

  document.querySelectorAll(".lic-opt").forEach(opt => {
    opt.onclick = () => {
      document.querySelectorAll(".lic-opt").forEach(o => o.classList.remove("active"));
      opt.classList.add("active");
      opt.querySelector("input").checked = true;
    };
  });

  $("qaCopy").onclick = () => {
    const link = p.fullUrl || p.url || "";
    navigator.clipboard.writeText(link).then(() => toast("Link copied"));
  };
  $("qaOpen").onclick = () => {
    const link = p.fullUrl || p.url;
    if (link) window.open(link, "_blank", "noopener");
  };

  $("lbImg").onclick = () => $("lbImg").classList.toggle("zoomed");

  $("lb").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeLb(){ $("lb").classList.remove("open"); document.body.style.overflow=""; current=null; }
$("lbx").onclick = closeLb;
$("lb").onclick = e => { if (e.target.id==="lb") closeLb(); };
document.addEventListener("keydown", e => { if (e.key==="Escape"){ closeLb(); } });
$("lbSave").onclick = () => current && toggleSave(current);

/* ===== Search ===== */
$("searchForm").onsubmit = async e => {
  e.preventDefault();
  term = $("q").value.trim();
  cat = $("catSel").value;

  if (term) {
    $("state").hidden = false;
    $("state").innerHTML = "Searching photos…";
    const freeMore = await fetchPixabayCached(term, 60);
    const seen = new Set(all.map(x => x.id));
    freeMore.forEach(p => { if (!seen.has(p.id)) { all.push(p); seen.add(p.id); } });
    buildCategories();
  }
  setCat(cat);
};

$("catSel").onchange = () => setCat($("catSel").value);
$("sort").onchange = apply;
$("more").onclick = () => render(false);

load();
</script>
