<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator — MINAMI STOCK</title>
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root{--ink:#e5e7eb;--mute:#94a3b8;--line:#1f2937;--bg:#0a0f1a;--soft:#111827;--blue:#10b981;--blue-d:#34d399}
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:#0a0f1a}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
    background:#0a0f1a;color:#e5e7eb;line-height:1.55;
    min-height:100vh;display:flex;flex-direction:column;
  }
  main{flex:1;max-width:780px;width:100%;margin:0 auto;padding:36px 20px}
  #ms-footer{width:100%}

  /* Force top-bar into dark mode for this page */
  header.top-nav{
    background:#0a0f1a !important;
    border-bottom-color:#1f2937 !important;
    color:#e5e7eb !important;
  }
  .sidebar-trigger,
  .shop-logo-btn,
  .btn-signin,
  .account-avatar{
    background:#0a0f1a !important;
    color:#e5e7eb !important;
    border-color:#1f2937 !important;
  }
  .sidebar-dropdown,
  .nav-drop-panel,
  .account-dropdown{
    background:#0a0f1a !important;
    border-color:#1f2937 !important;
    color:#e5e7eb !important;
  }
  .sidebar-dropdown a,
  .nav-drop-panel a,
  .account-menu-item{color:#e5e7eb !important}
  .sidebar-dropdown a:hover,
  .nav-drop-panel a:hover,
  .account-menu-item:hover{background:#111827 !important}

  .back{
    display:inline-flex;align-items:center;gap:8px;text-decoration:none;
    color:#6ee7b7;font-weight:700;font-size:14px;margin-bottom:20px;
    padding:7px 14px;border-radius:20px;border:1px solid #064e3b;background:#052e1f;
  }
  .back:hover{background:#064e3b}
  h1{font-size:30px;margin-bottom:8px;font-weight:900;color:#6ee7b7}
  .sub{color:#94a3b8;margin-bottom:26px;font-size:14.5px}

  .panel{
    background:linear-gradient(160deg,#064e3b 0%,#0a0f1a 100%);
    border:2px solid #10b981;border-radius:24px;padding:28px;
    box-shadow:0 12px 40px rgba(16,185,129,.12);
  }
  .out{
    background:#000;color:#6ee7b7;padding:22px;border-radius:14px;
    font-family:'Consolas',monospace;font-size:20px;font-weight:700;
    letter-spacing:1.5px;word-break:break-all;min-height:70px;
    display:flex;align-items:center;justify-content:center;text-align:center;
    margin-bottom:24px;border:1px solid #10b981;
    text-shadow:0 0 14px rgba(110,231,183,.4);
  }
  .slider-row{display:flex;align-items:center;gap:16px;margin-bottom:20px}
  .slider-row span:first-child{font-size:13.5px;font-weight:700;color:#6ee7b7;min-width:70px}
  .slider-row span:last-child{font-weight:800;color:#10b981;font-size:22px;min-width:50px;text-align:right}
  input[type=range]{flex:1;accent-color:#10b981;height:6px}

  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
  .opt{
    display:flex;align-items:center;gap:10px;padding:13px;
    border:2px solid #064e3b;border-radius:12px;background:#0a0f1a;
    font-size:13.5px;font-weight:600;color:#d1fae5;cursor:pointer;transition:.15s;
  }
  .opt:hover{border-color:#10b981;background:#052e1f}
  .opt input{accent-color:#10b981;width:auto;margin:0;cursor:pointer}

  .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
  .btn{
    border:2px solid #10b981;background:transparent;color:#6ee7b7;
    padding:12px 24px;border-radius:50px;font:inherit;font-weight:800;
    font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;
    transition:.15s;font-family:inherit;
  }
  .btn:hover{background:#10b981;color:#0a0f1a}
  .btn.main{
    background:#10b981;color:#0a0f1a;flex:1;justify-content:center;
    box-shadow:0 0 24px rgba(16,185,129,.4);
  }
  .btn.main:hover{background:#34d399;box-shadow:0 0 34px rgba(16,185,129,.6)}

  @media(max-width:520px){.opts{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- TOP BAR (auto inject by top-bar.js) -->
<div id="site-topbar"></div>

<main>
  <a class="back" href="tools.html"><i class="fas fa-arrow-left"></i> All Tools</a>

  <h1>🔑 Password Generator</h1>
  <p class="sub">Generate strong random passwords — customize to your needs.</p>

  <div class="panel">
    <div class="out" id="out">Click Generate →</div>

    <div class="slider-row">
      <span>Length</span>
      <input type="range" id="len" min="4" max="64" value="16">
      <span id="lenVal">16</span>
    </div>

    <div class="opts">
      <label class="opt"><input type="checkbox" id="oU" checked> Uppercase (A-Z)</label>
      <label class="opt"><input type="checkbox" id="oL" checked> Lowercase (a-z)</label>
      <label class="opt"><input type="checkbox" id="oN" checked> Numbers (0-9)</label>
      <label class="opt"><input type="checkbox" id="oS" checked> Symbols</label>
      <label class="opt" style="grid-column:1/-1">
        <input type="checkbox" id="oX"> Exclude confusing (0 O l 1 I)
      </label>
    </div>

    <div class="btns">
      <button class="btn main" id="gen"><i class="fas fa-bolt"></i> Generate</button>
      <button class="btn" id="copy"><i class="fas fa-copy"></i> Copy</button>
    </div>
  </div>
</main>

<!-- FOOTER (auto inject by site-footer.js) -->
<div id="ms-footer"></div>

<!-- ========== SHARED SCRIPTS ========== -->
<script src="top-bar.js"></script>
<script src="site-footer.js"></script>

<!-- ========== PASSWORD GENERATOR LOGIC ========== -->
<script>
(function(){
  const $ = id => document.getElementById(id);
  const out = $("out"), len = $("len"), lenVal = $("lenVal");

  len.addEventListener("input", () => lenVal.textContent = len.value);

  const gen = () => {
    const L = +len.value;
    const sets = [];

    if ($("oU").checked) sets.push("ABCDEFGHIJKLMNOPQRSTUVWXYZ");
    if ($("oL").checked) sets.push("abcdefghijklmnopqrstuvwxyz");
    if ($("oN").checked) sets.push("0123456789");
    if ($("oS").checked) sets.push("!@#$%^&*()-_=+[]{};:,.?/");

    if (!sets.length) {
      out.textContent = "⚠️ Select at least one option";
      return;
    }

    let all = sets.join("");

    // Exclude confusing characters
    if ($("oX").checked) {
      all = all.replace(/[0OolI1]/g, "");
      for (let i = 0; i < sets.length; i++) {
        sets[i] = sets[i].replace(/[0OolI1]/g, "");
      }
    }

    if (!all) {
      out.textContent = "⚠️ All characters removed. Change options.";
      return;
    }

    const pick = s => s[Math.floor(Math.random() * s.length)];
    const arr = [];

    // Ensure at least one char from each selected set
    sets.forEach(s => { if (s) arr.push(pick(s)); });

    // Fill remaining
    while (arr.length < L) arr.push(pick(all));

    // Shuffle (Fisher-Yates)
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }

    out.textContent = arr.slice(0, L).join("");
  };

  $("gen").addEventListener("click", gen);

  $("copy").addEventListener("click", async () => {
    const t = out.textContent;
    if (!t || t.startsWith("Click") || t.startsWith("⚠️")) return;
    try {
      await navigator.clipboard.writeText(t);
      const old = out.textContent;
      out.textContent = "✅ Copied to clipboard!";
      setTimeout(() => out.textContent = old, 1200);
    } catch (e) {
      out.textContent = "❌ Copy failed";
    }
  });

  // First run
  gen();
})();
</script>

</body>
</html>
