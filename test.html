<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Cloudinary Test</title>
  <style>
    body{font-family:system-ui;max-width:600px;margin:40px auto;padding:20px;background:#111;color:#eee}
    input,button{font-size:16px;padding:10px;border-radius:6px;border:1px solid #333;background:#222;color:#eee;width:100%;margin:6px 0}
    button{background:#fbbf24;color:#000;font-weight:700;cursor:pointer}
    pre{background:#000;padding:14px;border-radius:8px;font-size:12px;overflow:auto;max-height:400px}
    .ok{color:#4ade80}.bad{color:#f87171}
  </style>
</head>
<body>
  <h2>🔍 Cloudinary Diagnostic</h2>
  <p>নিচে আপনার Cloud name আর preset বসান:</p>
  <input id="cn" placeholder="Cloud name (e.g. ytjzpnb)" value="ytjzpnb">
  <input id="pr" placeholder="Upload preset" value="minami_unsigned">
  <button onclick="run()">▶ Test করো</button>
  <pre id="out">Waiting...</pre>

<script>
async function run(){
  const out = document.getElementById("out");
  const cn = document.getElementById("cn").value.trim();
  const pr = document.getElementById("pr").value.trim();
  out.innerHTML = "";

  function log(msg, ok){
    out.innerHTML += `<span class="${ok===true?'ok':ok===false?'bad':''}">${msg}</span>\n`;
  }

  log("Testing cloud name: '" + cn + "'");
  log("Testing preset: '" + pr + "'\n");

  // 1. Cloud name verify — sample image
  try {
    const r1 = await fetch(`https://res.cloudinary.com/${cn}/image/upload/sample.jpg`, { method: "HEAD" });
    log("1️⃣ Cloud name check: HTTP " + r1.status + " " + (r1.ok ? "✅ ঠিক আছে" : "❌ ভুল"), r1.ok);
  } catch(e){ log("1️⃣ Cloud name check FAILED: " + e.message, false); }

  // 2. Upload test — ছোট একটা 1x1 png
  const pngB64 = "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=";
  const blob = await (await fetch("data:image/png;base64," + pngB64)).blob();
  const fd = new FormData();
  fd.append("file", blob, "test.png");
  fd.append("upload_preset", pr);

  const url = `https://api.cloudinary.com/v1_1/${cn}/image/upload`;
  log("\n2️⃣ POST " + url);
  try {
    const r2 = await fetch(url, { method: "POST", body: fd });
    const txt = await r2.text();
    log("HTTP " + r2.status, r2.ok);
    log("Response:\n" + txt.substring(0, 500), r2.ok);
    if (r2.ok){
      const j = JSON.parse(txt);
      log("\n🎉 সফল! URL: " + j.secure_url, true);
      log("📌 আপনার CLIENT এ এটাই বসাবেন:", true);
      log(`   CLOUD_NAME    = "${cn}"`, true);
      log(`   UPLOAD_PRESET = "${pr}"`, true);
    }
  } catch(e){ log("2️⃣ Upload FAILED: " + e.message, false); }
}
</script>
</body>
</html>
