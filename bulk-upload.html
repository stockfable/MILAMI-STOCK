<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bulk Upload - MINAMI STOCK</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,Arial,sans-serif;background:#f7f8fa;color:#222;padding:20px;min-height:100vh}
.wrap{max-width:1200px;margin:auto}
h1{font-size:26px;margin-bottom:6px}
p.sub{color:#6e6e6e;font-size:14px;margin-bottom:18px;line-height:1.5}
.card{background:#fff;border:1px solid #e1e1e1;border-radius:12px;padding:18px;margin-bottom:16px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:0}
label{font-size:13px;font-weight:600;display:block;margin-bottom:4px}
input[type=text],select{width:100%;padding:10px 12px;border:1px solid #d5d5d5;border-radius:6px;font:inherit;background:#fff}
input:focus,select:focus{outline:none;border-color:#1473e6}
.drop{border:2px dashed #b9b9b9;border-radius:12px;padding:34px;text-align:center;cursor:pointer;background:#fafafa;transition:.15s}
.drop:hover{border-color:#1473e6;background:#f0f7ff}
.drop b{display:block;font-size:16px;margin-bottom:6px}
.drop span{font-size:13px;color:#6e6e6e}
button,.btn{border:1px solid #222;background:#fff;padding:10px 20px;border-radius:20px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;color:#222;display:inline-block;transition:.15s}
button.fill{background:#1473e6;border-color:#1473e6;color:#fff}
button.fill:hover:not(:disabled){background:#0d66d0}
button:disabled{opacity:.45;cursor:not-allowed}
#msg{font-size:14px;margin:12px 0;padding:10px 14px;border-radius:8px;min-height:20px;display:none}
#msg.show{display:block}
#msg.err{background:#fee;color:#c0392b;border:1px solid #f5c6c6}
#msg.ok{background:#e8f5ee;color:#1a8a4a;border:1px solid #b8e0c8}
#msg.info{background:#eef4ff;color:#1473e6;border:1px solid #c8d9f5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:16px}
.it{border:1px solid #e1e1e1;border-radius:10px;overflow:hidden;background:#fff;position:relative;transition:.15s}
.it.done{border-color:#1a8a4a;box-shadow:0 0 0 2px rgba(26,138,74,.15)}
.it.fail{border-color:#c0392b}
.it.proc{border-color:#1473e6}
.it .media{width:100%;aspect-ratio:4/3;background:#000;position:relative;overflow:hidden}
.it .media img,.it .media video{width:100%;height:100%;object-fit:cover;display:block}
.it .type-badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.75);color:#fff;font-size:10px;font-weight:800;padding:3px 9px;border-radius:10px;text-transform:uppercase;letter-spacing:.4px}
.it .type-badge.video{background:#e34ba9}
.it .prog{position:absolute;inset:auto 0 0 0;height:4px;background:rgba(255,255,255,.2)}
.it .prog > div{height:100%;background:#1473e6;width:0;transition:.15s}
.it .body{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.it input,.it select{width:100%;border:1px solid #e1e1e1;border-radius:5px;padding:6px 8px;font:inherit;font-size:12px;background:#fff}
.it input:focus,.it select:focus{outline:none;border-color:#1473e6}
.it .meta{font-size:11px;color:#6e6e6e;display:flex;gap:8px;flex-wrap:wrap}
.it .badge{display:inline-block;background:#eef4ff;color:#1473e6;font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px}
.it .status{font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;display:inline-block}
.it .status.done{background:#e8f5ee;color:#1a8a4a}
.it .status.fail{background:#fee;color:#c0392b}
.it .status.wait{background:#f5f5f5;color:#6e6e6e}
.it .status.proc{background:#eef4ff;color:#1473e6}
.rm{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;padding:0;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:16px;line-height:1;cursor:pointer;z-index:2}
.rm:hover{background:#c0392b}
.bk{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.stats{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0;font-size:13px;color:#6e6e6e}
.stats b{color:#222}
</style>
</head>
<body>
<div class="wrap">
  <h1>Bulk Upload (Cloudinary)</h1>
  <p class="sub">ছবি ও ভিডিও একসাথে সিলেক্ট করুন। Title, category, keywords auto-fill হবে — চাইলে edit করতে পারবেন। Signed-in users only.</p>

  <div class="card">
    <div class="form">
      <div>
        <label for="ai">Content type</label>
        <select id="ai">
          <option value="no">Real (photo/video)</option>
          <option value="yes">AI generated</option>
        </select>
      </div>
      <div>
        <label for="catOverride">Default category (auto-guess হবে যদি খালি রাখেন)</label>
        <select id="catOverride">
          <option value="">— Auto —</option>
          <option>Business</option>
          <option>Nature</option>
          <option>People</option>
          <option>Technology</option>
          <option>Travel</option>
          <option>Food</option>
          <option>Architecture</option>
          <option>Abstract</option>
          <option>Other</option>
        </select>
      </div>
    </div>
  </div>

  <div class="drop" id="drop">
    <b>📁 Tap to choose photos & videos</b>
    <span>JPG, PNG, WEBP, MP4, MOV, WEBM — একসাথে অনেক ফাইল</span>
  </div>
  <input type="file" id="file" accept="image/*,video/*" multiple hidden>

  <div class="stats" id="stats" style="display:none">
    <span>Total: <b id="statTotal">0</b></span>
    <span>Uploaded: <b id="statOk">0</b></span>
    <span>Failed: <b id="statFail">0</b></span>
  </div>

  <div class="grid" id="grid"></div>

  <div id="msg"></div>

  <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
    <button class="fill" id="save" disabled>☁️ Upload all to Cloudinary</button>
    <button id="clearBtn">Clear all</button>
  </div>

  <div class="bk">
    <a class="btn" href="stock-photo.html">Stock Photos</a>
    <a class="btn" href="admin.html">Admin panel</a>
    <a class="btn" href="index.html">Home</a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
/* ================================================================
   CONFIG
   ================================================================ */
const CLOUD_NAME    = "yt1jzpnb";
const UPLOAD_PRESET = "minami_unsigned";
const FOLDER        = "minami-stock";

const FB = {
  apiKey: "AIzaSyAzWwbk-Dh1Kzzp9CvNyqC28ToCWXw41Qs",
  authDomain: "creoverse-stock.firebaseapp.com",
  projectId: "creoverse-stock",
  storageBucket: "creoverse-stock.firebasestorage.app",
  messagingSenderId: "128072247505",
  appId: "1:128072247505:web:47e58c3a140f4e858bbdf0"
};
if (!firebase.apps.length) firebase.initializeApp(FB);
const auth = firebase.auth();
const db = firebase.firestore();
const PHOTO_COLLECTION = "stockphoto";

/* ================================================================
   STATE
   ================================================================ */
let user = null;
let items = [];

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function msg(text, cls){
  const m = $("msg");
  m.textContent = text;
  m.className = "show " + (cls || "info");
}
function hideMsg(){ $("msg").className = ""; }

function updateStats(){
  const total = items.length;
  const ok = items.filter(i => i.status === "done").length;
  const fail = items.filter(i => i.status === "fail").length;
  if (!total){ $("stats").style.display = "none"; return; }
  $("stats").style.display = "flex";
  $("statTotal").textContent = total;
  $("statOk").textContent = ok;
  $("statFail").textContent = fail;
}

function refreshSave(){
  const pending = items.filter(i => i.status === "wait").length;
  $("save").disabled = !(user && pending > 0);
  $("save").textContent = pending > 0
    ? "☁️ Upload " + pending + " file" + (pending === 1 ? "" : "s") + " to Cloudinary"
    : "☁️ Upload all to Cloudinary";
}

/* ================================================================
   AUTO-FILL
   ================================================================ */
function autoTitle(name){
  const t = name.replace(/\.[^.]+$/, "")
                .replace(/[_\-]+/g, " ")
                .replace(/\s+/g, " ")
                .replace(/^\d+\s*/, "")
                .trim();
  if (!t) return "Untitled";
  return t.charAt(0).toUpperCase() + t.slice(1);
}

const CATEGORY_MAP = {
  Business:     ["meeting","office","business","conference","desk","work","corporate","team","startup","finance","money","chart"],
  Nature:       ["nature","tree","forest","mountain","flower","sky","river","ocean","beach","sunset","sunrise","leaf","plant","waterfall","cloud","sea","landscape","garden"],
  People:       ["people","person","man","woman","boy","girl","portrait","face","model","family","child","baby","friend","couple","smile"],
  Technology:   ["tech","computer","laptop","phone","mobile","code","coding","robot","ai","server","gadget","software","hardware","keyboard","digital","data"],
  Travel:       ["travel","trip","city","road","airport","tourism","landmark","hotel","vacation","journey","map","skyline","urban"],
  Food:         ["food","meal","pizza","burger","coffee","cake","fruit","drink","restaurant","breakfast","lunch","dinner","vegetable","dessert","sushi"],
  Architecture: ["building","house","architecture","bridge","tower","interior","construction","window","door","wall"],
  Abstract:     ["abstract","pattern","texture","color","gradient","background","shape","line","design","3d","render","neon","glow"]
};
function autoCategory(name){
  const base = name.toLowerCase();
  for (const [cat, keys] of Object.entries(CATEGORY_MAP)){
    if (keys.some(k => base.includes(k))) return cat;
  }
  return "Other";
}

function autoKeywords(name, cat){
  const base = name.replace(/\.[^.]+$/, "").toLowerCase();
  const words = base.split(/[\s_\-.]+/).filter(w => w.length > 2 && !/^\d+$/.test(w));
  const set = new Set([...words]);
  set.add(cat.toLowerCase());
  ["stock","photo","minami","hd","high quality"].forEach(k => set.add(k));
  return [...set].slice(0, 25);
}

/* ================================================================
   CLOUDINARY UPLOAD
   ================================================================ */
function uploadToCloudinary(file, onProgress){
  return new Promise((resolve, reject) => {
    const fd = new FormData();
    fd.append("file", file);
    fd.append("upload_preset", UPLOAD_PRESET);
    fd.append("folder", FOLDER);

    const type = file.type.startsWith("video/") ? "video"
               : file.type === "application/pdf" ? "raw"
               : "image";

    const xhr = new XMLHttpRequest();
    xhr.open("POST", `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${type}/upload`);

    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable && onProgress) {
        onProgress(Math.round(e.loaded / e.total * 100));
      }
    };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        try { resolve(JSON.parse(xhr.responseText)); }
        catch (e) { reject(new Error("Invalid response")); }
      } else {
        let m = "Upload fail (" + xhr.status + ")";
        try { m = JSON.parse(xhr.responseText).error.message || m; } catch(e){}
        reject(new Error(m));
      }
    };
    xhr.onerror = () => reject(new Error("Network error"));
    xhr.send(fd);
  });
}

/* ================================================================
   AUTH
   ================================================================ */
auth.onAuthStateChanged(u => {
  user = u;
  if (!u){
    msg("⚠️ আপনি login করেননি। আগে login.html থেকে login করুন।", "err");
  } else {
    msg("✅ Signed in as " + (u.displayName || u.email), "ok");
    setTimeout(hideMsg, 2500);
  }
  refreshSave();
});

/* ================================================================
   FILE PICKER
   ================================================================ */
$("drop").onclick = () => $("file").click();

$("file").onchange = e => {
  const files = Array.from(e.target.files || []);
  e.target.value = "";
  if (!files.length) return;

  let added = 0;
  for (const f of files){
    const isImage = f.type.startsWith("image/");
    const isVideo = f.type.startsWith("video/");
    if (!isImage && !isVideo) continue;

    const catOverride = $("catOverride").value;
    const category = catOverride || autoCategory(f.name);
    const title = autoTitle(f.name);
    const keywords = autoKeywords(f.name, category);
    const previewUrl = URL.createObjectURL(f);

    const it = {
      id: "it_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8),
      file: f,
      title, category, keywords,
      isVideo,
      previewUrl,
      status: "wait",
      progress: 0,
      el: null
    };
    items.push(it);
    renderCard(it);
    added++;
  }

  if (added){
    msg("✅ " + added + " file" + (added === 1 ? "" : "s") + " ready। সব ঠিক থাকলে Upload ক্লিক করুন।", "ok");
  } else {
    msg("❌ কোনো image বা video পাওয়া গেল না।", "err");
  }
  updateStats();
  refreshSave();
};

/* ================================================================
   RENDER CARD
   ================================================================ */
function renderCard(it){
  const d = document.createElement("div");
  d.className = "it";
  d.dataset.id = it.id;

  const mediaHTML = it.isVideo
    ? '<video src="' + it.previewUrl + '" muted preload="metadata"></video>'
    : '<img src="' + it.previewUrl + '" alt="">';

  d.innerHTML =
    '<button class="rm" title="Remove">×</button>' +
    '<div class="media">' +
      mediaHTML +
      '<span class="type-badge ' + (it.isVideo ? 'video' : '') + '">' + (it.isVideo ? '🎬 Video' : '📷 Image') + '</span>' +
      '<div class="prog"><div></div></div>' +
    '</div>' +
    '<div class="body">' +
      '<input type="text" class="t" placeholder="Title" value="' + esc(it.title) + '">' +
      '<input type="text" class="k" placeholder="keywords, comma, separated" value="' + esc(it.keywords.join(", ")) + '">' +
      '<select class="c">' +
        ["Business","Nature","People","Technology","Travel","Food","Architecture","Abstract","Other"]
          .map(o => '<option ' + (o === it.category ? 'selected' : '') + '>' + o + '</option>').join("") +
      '</select>' +
      '<div class="meta">' +
        '<span class="badge">' + (it.file.size / 1024 / 1024).toFixed(1) + ' MB</span>' +
        '<span class="status wait">Waiting</span>' +
      '</div>' +
    '</div>';

  // bind
  d.querySelector(".rm").onclick = () => {
    items = items.filter(x => x.id !== it.id);
    d.remove();
    updateStats(); refreshSave();
  };
  d.querySelector(".t").oninput = e => { it.title = e.target.value; };
  d.querySelector(".k").oninput = e => {
    it.keywords = e.target.value.split(",").map(s => s.trim()).filter(Boolean);
  };
  d.querySelector(".c").onchange = e => { it.category = e.target.value; };

  it.el = d;
  $("grid").appendChild(d);
}

/* update card UI when status changes */
function updateCard(it){
  if (!it.el) return;
  const d = it.el;
  d.classList.remove("done", "fail", "proc");
  if (it.status === "done") d.classList.add("done");
  else if (it.status === "fail") d.classList.add("fail");
  else if (it.status === "proc") d.classList.add("proc");

  const st = d.querySelector(".status");
  if (st) {
    st.className = "status " + it.status;
    st.textContent =
      it.status === "wait" ? "Waiting" :
      it.status === "proc" ? "Uploading " + it.progress + "%" :
      it.status === "done" ? "✓ Uploaded" :
      "✕ Failed";
  }
  const bar = d.querySelector(".prog > div");
  if (bar) bar.style.width = (it.progress || 0) + "%";
}

/* ================================================================
   SAVE ALL
   ================================================================ */
$("save").onclick = async () => {
  if (!user){
    msg("❌ আগে login করুন।", "err");
    return;
  }
  const pending = items.filter(i => i.status === "wait" || i.status === "fail");
  if (!pending.length){
    msg("ℹ️ Upload করার মতো কিছু নেই।", "info");
    return;
  }

  const aiFlag = $("ai").value === "yes";
  const u = firebase.auth().currentUser;
  const author = u.displayName || (u.email || "MINAMI STOCK").split("@")[0];

  $("save").disabled = true;
  msg("☁️ Uploading " + pending.length + " file(s)...", "info");

  let doneCount = 0, failCount = 0;

  for (const it of pending){
    it.status = "proc";
    it.progress = 0;
    updateCard(it);

    try {
      const res = await uploadToCloudinary(it.file, (p) => {
        it.progress = p;
        updateCard(it);
      });

      // thumbnail URL
      let thumb = res.secure_url;
      if (it.isVideo){
        thumb = res.secure_url
          .replace("/upload/", "/upload/so_1,w_500,q_auto,f_auto/")
          .replace(/\.(mp4|mov|webm|mkv|avi)$/i, ".jpg");
      } else {
        thumb = res.secure_url.replace("/upload/", "/upload/w_500,q_auto,f_auto/");
      }

      // Firestore এ metadata
      await db.collection(PHOTO_COLLECTION).add({
        title: it.title.trim() || "Untitled",
        category: it.category,
        keywords: it.keywords,
        fileType: it.isVideo ? "Video" : "Photo",
        contentType: it.isVideo ? "video" : "image",
        description: "",
        url: res.secure_url,
        imageUrl: res.secure_url,
        thumb: thumb,
        width: res.width || null,
        height: res.height || null,
        duration: res.duration || null,
        bytes: res.bytes,
        publicId: res.public_id,
        format: res.format,
        aiGenerated: aiFlag,
        editorial: false,
        recognizable: false,
        releaseAttached: false,
        releaseInfo: null,
        status: "approved",           // admin panel এ approved by default (bulk upload admin নিজেই)
        uploadedBy: u.uid,
        ownerId: u.uid,
        ownerEmail: u.email || "",
        author: author,
        authorUid: u.uid,
        source: "upload",
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      it.status = "done";
      it.progress = 100;
      doneCount++;
    } catch (err) {
      console.error(err);
      it.status = "fail";
      it.error = err.message;
      failCount++;
    }
    updateCard(it);
    updateStats();

    msg("☁️ Progress: " + doneCount + " uploaded, " + failCount + " failed, " +
        (pending.length - doneCount - failCount) + " remaining...", "info");
  }

  if (failCount === 0){
    msg("🎉 সফল! " + doneCount + " file uploaded। stock-photo.html এ দেখুন।", "ok");
  } else {
    msg("⚠️ " + doneCount + " uploaded, " + failCount + " failed। Failed card গুলোর দিকে তাকান।", "err");
  }
  updateStats();
  refreshSave();
};

/* ================================================================
   CLEAR ALL
   ================================================================ */
$("clearBtn").onclick = () => {
  if (!items.length) return;
  if (!confirm("সব pending file মুছে ফেলবেন?")) return;
  items.forEach(i => {
    if (i.status === "wait" || i.status === "fail"){
      if (i.previewUrl) URL.revokeObjectURL(i.previewUrl);
      if (i.el) i.el.remove();
    }
  });
  items = items.filter(i => i.status === "done");
  updateStats();
  refreshSave();
};

/* init */
updateStats();
refreshSave();
</script>
</body>
</html>
