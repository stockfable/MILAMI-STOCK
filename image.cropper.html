<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Cropper - MINAMI STOCK</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--ink:#222;--mute:#6e6e6e;--line:#e1e1e1;--bg:#fff;--soft:#f5f5f5;--blue:#1473e6;--blue-d:#0d66d0;--ok:#12805c;--bad:#d7373f}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* MAIN */
main{flex:1;padding:28px 20px}
.wrap{max-width:1200px;margin:auto}
.page-head{margin-bottom:24px}
.page-head h1{font-size:26px;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:12px}
.page-head h1 i{color:var(--blue)}
.page-head p{color:var(--mute);font-size:14px;line-height:1.55;max-width:720px}

.drop{border:2px dashed var(--line);border-radius:12px;padding:44px 20px;text-align:center;background:var(--soft);cursor:pointer;transition:.2s;margin-bottom:20px}
.drop:hover,.drop.over{border-color:var(--blue);background:#eaf2fd}
.drop i{font-size:44px;color:var(--blue);margin-bottom:14px;display:block}
.drop b{display:block;font-size:17px;margin-bottom:6px}
.drop span{color:var(--mute);font-size:13px}

#msg{margin:12px 0;font-size:14px;min-height:20px;text-align:center}
#msg.err{color:var(--bad)}
#msg.ok{color:var(--ok)}

.workspace{display:none;grid-template-columns:1fr 340px;gap:24px}
.workspace.show{display:grid}
.crop-stage{background:#1a1a1a;border-radius:12px;padding:20px;position:relative;overflow:hidden;min-height:500px;display:flex;align-items:center;justify-content:center}
.crop-container{position:relative;user-select:none;line-height:0;max-width:100%;max-height:70vh}
.crop-container img{display:block;max-width:100%;max-height:70vh;user-select:none;-webkit-user-drag:none;pointer-events:none}
.crop-overlay{position:absolute;inset:0;overflow:hidden}
.crop-box{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.6);cursor:move;box-sizing:border-box}
.crop-box::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to right,rgba(255,255,255,.35) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.35) 1px,transparent 1px);background-size:33.333% 33.333%}
.h{position:absolute;width:20px;height:20px;background:#fff;border:1px solid #999;border-radius:3px;z-index:2}
.h-nw{top:-10px;left:-10px;cursor:nwse-resize}
.h-ne{top:-10px;right:-10px;cursor:nesw-resize}
.h-sw{bottom:-10px;left:-10px;cursor:nesw-resize}
.h-se{bottom:-10px;right:-10px;cursor:nwse-resize}
.h-n{top:-10px;left:50%;transform:translateX(-50%);cursor:ns-resize;width:26px;height:10px}
.h-s{bottom:-10px;left:50%;transform:translateX(-50%);cursor:ns-resize;width:26px;height:10px}
.h-w{left:-10px;top:50%;transform:translateY(-50%);cursor:ew-resize;width:10px;height:26px}
.h-e{right:-10px;top:50%;transform:translateY(-50%);cursor:ew-resize;width:10px;height:26px}
.crop-size{position:absolute;bottom:-32px;left:0;background:rgba(0,0,0,.85);color:#fff;font-size:12px;padding:4px 10px;border-radius:6px;font-weight:600;font-family:Consolas,monospace}

.side{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel h3{font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.panel h3 i{color:var(--blue)}

.ratios{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.ratio{padding:10px 4px;border:1px solid var(--line);background:var(--bg);border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:.15s;text-align:center}
.ratio:hover{border-color:var(--blue);color:var(--blue)}
.ratio.on{background:var(--blue);color:#fff;border-color:var(--blue)}

.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--mute);margin-bottom:5px}
.field input[type=number],.field select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px;background:var(--bg);color:var(--ink)}
.field input:focus,.field select:focus{outline:none;border-color:var(--blue)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn-group{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.mini-btn{padding:10px 6px;border:1px solid var(--line);background:var(--bg);border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:.15s}
.mini-btn:hover{border-color:var(--blue);color:var(--blue)}
.mini-btn i{font-size:14px}

.actions{display:flex;flex-direction:column;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;transition:.15s;text-decoration:none}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-d)}

.preview-box{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
.preview-box canvas{max-width:100%;max-height:180px;border-radius:6px;background:#fff}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:11px 20px;border-radius:6px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:90}
#toast.show{opacity:1;transform:translateX(-50%)}

@media(max-width:900px){
  .workspace{grid-template-columns:1fr}
  .page-head h1{font-size:22px}
  .crop-stage{min-height:340px;padding:10px}
  .crop-container img{max-height:45vh}
}
</style>
</head>
<body>

<!-- TOP BAR (JS inject করবে) -->
<div id="site-topbar"></div>

<!-- MAIN (Cropper tool) -->
<main>
  <div class="wrap">
    <div class="page-head">
      <h1><i class="fas fa-crop"></i> Image Cropper</h1>
      <p>Crop images with precision. Drag corners to resize, or choose a preset aspect ratio. Everything runs in your browser — no upload needed.</p>
    </div>

    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose image">
      <i class="fas fa-image"></i>
      <b>Drop image here, or click to choose</b>
      <span>JPG, PNG, WebP · Max 20 MB</span>
      <input type="file" id="pick" accept="image/*" hidden>
    </div>

    <div id="msg"></div>

    <div class="workspace" id="workspace">
      <div class="crop-stage">
        <div class="crop-container" id="cropContainer">
          <img id="cropImage" alt="Image to crop">
          <div class="crop-overlay" id="cropOverlay">
            <div class="crop-box" id="cropBox">
              <div class="h h-nw" data-h="nw"></div>
              <div class="h h-ne" data-h="ne"></div>
              <div class="h h-sw" data-h="sw"></div>
              <div class="h h-se" data-h="se"></div>
              <div class="h h-n" data-h="n"></div>
              <div class="h h-s" data-h="s"></div>
              <div class="h h-w" data-h="w"></div>
              <div class="h h-e" data-h="e"></div>
              <div class="crop-size" id="cropSize">— × —</div>
            </div>
          </div>
        </div>
      </div>

      <div class="side">
        <div class="panel">
          <h3><i class="fas fa-vector-square"></i> Aspect ratio</h3>
          <div class="ratios" id="ratios">
            <button class="ratio on" data-r="free">Free</button>
            <button class="ratio" data-r="1">1:1</button>
            <button class="ratio" data-r="1.7777">16:9</button>
            <button class="ratio" data-r="1.3333">4:3</button>
            <button class="ratio" data-r="1.5">3:2</button>
            <button class="ratio" data-r="0.5625">9:16</button>
          </div>
        </div>

        <div class="panel">
          <h3><i class="fas fa-sync-alt"></i> Transform</h3>
          <div class="btn-group">
            <button class="mini-btn" id="rotateLeft"><i class="fas fa-undo"></i> Rotate L</button>
            <button class="mini-btn" id="rotateRight"><i class="fas fa-redo"></i> Rotate R</button>
            <button class="mini-btn" id="resetBtn"><i class="fas fa-redo-alt"></i> Reset</button>
          </div>
          <div class="btn-group">
            <button class="mini-btn" id="flipH"><i class="fas fa-arrows-alt-h"></i> Flip H</button>
            <button class="mini-btn" id="flipV"><i class="fas fa-arrows-alt-v"></i> Flip V</button>
            <button class="mini-btn" id="fitBtn"><i class="fas fa-expand-arrows-alt"></i> Fit</button>
          </div>
        </div>

        <div class="panel">
          <h3><i class="fas fa-arrows-alt"></i> Exact size</h3>
          <div class="field-row">
            <div class="field"><label>Width (px)</label><input type="number" id="outW" min="1" max="10000"></div>
            <div class="field"><label>Height (px)</label><input type="number" id="outH" min="1" max="10000"></div>
          </div>
          <div class="field">
            <label>Output format</label>
            <select id="format">
              <option value="image/jpeg">JPEG</option>
              <option value="image/png">PNG</option>
              <option value="image/webp">WebP</option>
            </select>
          </div>
          <div class="field">
            <label>Quality</label>
            <input type="range" id="quality" min="10" max="100" value="92" style="width:100%;accent-color:var(--blue)">
          </div>
        </div>

        <div class="panel">
          <h3><i class="fas fa-eye"></i> Preview</h3>
          <div class="preview-box"><canvas id="previewCanvas"></canvas></div>
        </div>

        <div class="actions">
          <button class="btn primary" id="cropBtn"><i class="fas fa-crop"></i> Apply crop & download</button>
          <button class="btn" id="newBtn"><i class="fas fa-image"></i> Choose another</button>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- FOOTER (JS inject করবে) -->
<div id="ms-footer"></div>

<div id="toast"></div>

<!-- SHARED SCRIPTS -->
<script src="top-bar.js"></script>
<script src="site-footer.js"></script>

<!-- TOOL LOGIC -->
<script>
const $ = id => document.getElementById(id);
let img = null, imgW = 0, imgH = 0;
let rotation = 0, flipHState = false, flipVState = false;
let aspectRatio = null;
let crop = { x:0, y:0, w:0, h:0 };
let dragging = null;
let originalFile = null;

function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("show"),2200); }
function msg(t, cls){ const m=$("msg"); m.textContent = t || ""; m.className = cls || ""; }
function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

/* Sidebar dropdown */
$("appsBtn") && ($("appsBtn").onclick = e => { e.stopPropagation(); $("appsDrop").classList.toggle("show"); });
document.addEventListener("click", e => {
  const sm = $("sidebarMenu");
  if (sm && !sm.contains(e.target)) $("appsDrop").classList.remove("show");
});

/* File picker */
const drop = $("drop"), pick = $("pick");
drop.onclick = () => pick.click();
drop.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick.click(); } };
["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => { if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });
pick.onchange = () => { if (pick.files[0]) loadFile(pick.files[0]); pick.value = ""; };

function loadFile(file){
  if (!file.type.startsWith("image/")) { msg("Only image files allowed.", "err"); return; }
  if (file.size > 20*1024*1024) { msg("File too large. Max 20 MB.", "err"); return; }
  originalFile = file;
  const url = URL.createObjectURL(file);
  const image = new Image();
  image.onload = () => {
    img = image; imgW = image.naturalWidth; imgH = image.naturalHeight;
    rotation = 0; flipHState = false; flipVState = false; aspectRatio = null;
    document.querySelectorAll(".ratio").forEach(r => r.classList.remove("on"));
    document.querySelector(".ratio[data-r='free']").classList.add("on");
    $("cropImage").src = url;
    $("cropImage").onload = () => {
      $("workspace").classList.add("show");
      drop.style.display = "none";
      resetCropToFull();
      msg("Drag corners to resize. Choose aspect ratio or press Apply crop to download.", "ok");
    };
  };
  image.onerror = () => msg("Could not read this image.", "err");
  image.src = url;
}

function resetCropToFull(){
  const container = $("cropContainer");
  const cw = container.clientWidth, ch = container.clientHeight;
  const w = cw * 0.9, h = ch * 0.9;
  crop = { x: (cw - w)/2, y: (ch - h)/2, w, h };
  applyCropBox();
}

function applyCropBox(){
  const box = $("cropBox");
  box.style.left = crop.x + "px";
  box.style.top = crop.y + "px";
  box.style.width = crop.w + "px";
  box.style.height = crop.h + "px";
  updateCropSizeLabel();
  updatePreview();
}

function updateCropSizeLabel(){
  const iw = $("cropImage").clientWidth, ih = $("cropImage").clientHeight;
  const scaleX = imgW / iw, scaleY = imgH / ih;
  const realW = Math.round(crop.w * scaleX);
  const realH = Math.round(crop.h * scaleY);
  $("cropSize").textContent = realW + " × " + realH + " px";
  $("outW").value = realW;
  $("outH").value = realH;
}

document.querySelectorAll(".ratio").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".ratio").forEach(r => r.classList.remove("on"));
    btn.classList.add("on");
    const r = btn.dataset.r;
    aspectRatio = r === "free" ? null : parseFloat(r);
    if (aspectRatio) fitCropToAspect(aspectRatio);
  };
});

function fitCropToAspect(ratio){
  const container = $("cropContainer");
  const cw = container.clientWidth, ch = container.clientHeight;
  let w = cw * 0.9, h = w / ratio;
  if (h > ch * 0.9) { h = ch * 0.9; w = h * ratio; }
  crop = { x: (cw - w)/2, y: (ch - h)/2, w, h };
  applyCropBox();
}

$("rotateLeft").onclick = () => { rotation = (rotation - 90 + 360) % 360; applyTransform(); };
$("rotateRight").onclick = () => { rotation = (rotation + 90) % 360; applyTransform(); };
$("flipH").onclick = () => { flipHState = !flipHState; applyTransform(); };
$("flipV").onclick = () => { flipVState = !flipVState; applyTransform(); };
$("resetBtn").onclick = () => {
  rotation = 0; flipHState = false; flipVState = false; aspectRatio = null;
  document.querySelectorAll(".ratio").forEach(r => r.classList.remove("on"));
  document.querySelector(".ratio[data-r='free']").classList.add("on");
  applyTransform();
};
$("fitBtn").onclick = resetCropToFull;

function applyTransform(){
  const im = $("cropImage");
  const sx = flipHState ? -1 : 1, sy = flipVState ? -1 : 1;
  im.style.transform = `rotate(${rotation}deg) scale(${sx}, ${sy})`;
  setTimeout(resetCropToFull, 30);
}

$("outW").addEventListener("input", () => {
  if (!img) return;
  const w = parseInt($("outW").value);
  if (!w || w < 1) return;
  $("outH").value = Math.round(w * imgH / imgW);
});
$("outH").addEventListener("input", () => {
  if (!img) return;
  const h = parseInt($("outH").value);
  if (!h || h < 1) return;
  $("outW").value = Math.round(h * imgW / imgH);
});

/* Drag */
$("cropBox").querySelectorAll(".h").forEach(h => {
  h.addEventListener("mousedown", startDrag);
  h.addEventListener("touchstart", startDrag, { passive: false });
});
$("cropBox").addEventListener("mousedown", e => { if (!e.target.classList.contains("h")) startDrag(e, "move"); });
$("cropBox").addEventListener("touchstart", e => { if (!e.target.classList.contains("h")) startDrag(e, "move"); }, { passive: false });

function startDrag(e, forceHandle){
  e.preventDefault(); e.stopPropagation();
  const handle = forceHandle || e.target.dataset.h || "move";
  const pos = getEventPos(e);
  dragging = { handle, startX: pos.x, startY: pos.y, startCrop: {...crop} };
  document.addEventListener("mousemove", onDrag);
  document.addEventListener("touchmove", onDrag, { passive: false });
  document.addEventListener("mouseup", stopDrag);
  document.addEventListener("touchend", stopDrag);
}

function getEventPos(e){
  if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}

function onDrag(e){
  if (!dragging) return;
  e.preventDefault();
  const pos = getEventPos(e);
  const dx = pos.x - dragging.startX, dy = pos.y - dragging.startY;
  const s = dragging.startCrop;
  const container = $("cropContainer");
  const cw = container.clientWidth, ch = container.clientHeight;
  let x = s.x, y = s.y, w = s.w, h = s.h;
  const MIN = 30;

  switch (dragging.handle) {
    case "move": x = clamp(s.x + dx, 0, cw - s.w); y = clamp(s.y + dy, 0, ch - s.h); break;
    case "nw": x = clamp(s.x + dx, 0, s.x + s.w - MIN); y = clamp(s.y + dy, 0, s.y + s.h - MIN); w = s.x + s.w - x; h = s.y + s.h - y; break;
    case "ne": y = clamp(s.y + dy, 0, s.y + s.h - MIN); w = clamp(s.w + dx, MIN, cw - s.x); h = s.y + s.h - y; break;
    case "sw": x = clamp(s.x + dx, 0, s.x + s.w - MIN); w = s.x + s.w - x; h = clamp(s.h + dy, MIN, ch - s.y); break;
    case "se": w = clamp(s.w + dx, MIN, cw - s.x); h = clamp(s.h + dy, MIN, ch - s.y); break;
    case "n": y = clamp(s.y + dy, 0, s.y + s.h - MIN); h = s.y + s.h - y; break;
    case "s": h = clamp(s.h + dy, MIN, ch - s.y); break;
    case "w": x = clamp(s.x + dx, 0, s.x + s.w - MIN); w = s.x + s.w - x; break;
    case "e": w = clamp(s.w + dx, MIN, cw - s.x); break;
  }

  if (aspectRatio && dragging.handle !== "move") {
    if (["n","s"].includes(dragging.handle)) { w = h * aspectRatio; if (x + w > cw) { w = cw - x; h = w / aspectRatio; } }
    else if (["e","w"].includes(dragging.handle)) { h = w / aspectRatio; if (y + h > ch) { h = ch - y; w = h * aspectRatio; } }
    else {
      h = w / aspectRatio;
      if (y + h > ch) { h = ch - y; w = h * aspectRatio; }
      if (x + w > cw) { w = cw - x; h = w / aspectRatio; }
    }
  }
  x = clamp(x, 0, cw - w); y = clamp(y, 0, ch - h);
  crop = { x, y, w, h };
  applyCropBox();
}

function stopDrag(){
  dragging = null;
  document.removeEventListener("mousemove", onDrag);
  document.removeEventListener("touchmove", onDrag);
  document.removeEventListener("mouseup", stopDrag);
  document.removeEventListener("touchend", stopDrag);
}

window.addEventListener("resize", () => {
  if (!img) return;
  const container = $("cropContainer");
  const cw = container.clientWidth, ch = container.clientHeight;
  crop.x = clamp(crop.x, 0, cw - crop.w);
  crop.y = clamp(crop.y, 0, ch - crop.h);
  if (crop.w > cw) crop.w = cw;
  if (crop.h > ch) crop.h = ch;
  applyCropBox();
});

function updatePreview(){
  if (!img) return;
  const iw = $("cropImage").clientWidth, ih = $("cropImage").clientHeight;
  const scaleX = imgW / iw, scaleY = imgH / ih;
  const sx = crop.x * scaleX, sy = crop.y * scaleY;
  const sw = crop.w * scaleX, sh = crop.h * scaleY;
  const canvas = $("previewCanvas");
  canvas.width = Math.min(400, Math.round(sw));
  canvas.height = Math.round(canvas.width * sh / sw);
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  drawTransformed(ctx, canvas.width, canvas.height, sx, sy, sw, sh);
}

function drawTransformed(ctx, outW, outH, sx, sy, sw, sh){
  const tmp = document.createElement("canvas");
  const rotated = rotation === 90 || rotation === 270;
  tmp.width = rotated ? imgH : imgW;
  tmp.height = rotated ? imgW : imgH;
  const tctx = tmp.getContext("2d");
  tctx.imageSmoothingEnabled = true;
  tctx.imageSmoothingQuality = "high";
  tctx.save();
  tctx.translate(tmp.width/2, tmp.height/2);
  tctx.rotate(rotation * Math.PI / 180);
  tctx.scale(flipHState ? -1 : 1, flipVState ? -1 : 1);
  tctx.drawImage(img, -imgW/2, -imgH/2);
  tctx.restore();

  let tx = sx, ty = sy, tw = sw, th = sh;
  if (rotation === 90) { tx = imgH - sy - sh; ty = sx; tw = sh; th = sw; }
  else if (rotation === 180) { tx = imgW - sx - sw; ty = imgH - sy - sh; tw = sw; th = sh; }
  else if (rotation === 270) { tx = sy; ty = imgW - sx - sw; tw = sh; th = sw; }
  if (flipHState) tx = tmp.width - tx - tw;
  if (flipVState) ty = tmp.height - ty - th;

  ctx.drawImage(tmp, tx, ty, tw, th, 0, 0, outW, outH);
}

$("cropBtn").onclick = () => {
  if (!img) return;
  const iw = $("cropImage").clientWidth, ih = $("cropImage").clientHeight;
  const scaleX = imgW / iw, scaleY = imgH / ih;
  const sx = crop.x * scaleX, sy = crop.y * scaleY;
  const sw = crop.w * scaleX, sh = crop.h * scaleY;
  const outW = Math.max(1, Math.min(10000, parseInt($("outW").value) || Math.round(sw)));
  const outH = Math.max(1, Math.min(10000, parseInt($("outH").value) || Math.round(sh)));
  const canvas = document.createElement("canvas");
  canvas.width = outW; canvas.height = outH;
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  const type = $("format").value;
  if (type === "image/jpeg") { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, outW, outH); }
  drawTransformed(ctx, outW, outH, sx, sy, sw, sh);
  const quality = (parseInt($("quality").value) || 92) / 100;
  canvas.toBlob(blob => {
    if (!blob) { msg("Crop failed.", "err"); return; }
    const ext = type === "image/png" ? "png" : type === "image/webp" ? "webp" : "jpg";
    const base = (originalFile.name || "image").replace(/\.[^.]+$/, "");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = base + "-cropped-" + outW + "x" + outH + "." + ext;
    a.click();
    msg("Cropped and downloaded (" + outW + "×" + outH + ").", "ok");
    toast("Downloaded!");
  }, type, quality);
};

$("newBtn").onclick = () => {
  img = null; originalFile = null;
  $("workspace").classList.remove("show");
  drop.style.display = "";
  msg("");
};
</script>
</body>
