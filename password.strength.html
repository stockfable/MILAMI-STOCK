<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Strength Checker — AMR Tools</title>
<meta name="color-scheme" content="light only">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root{--line:#e1e1e1;--bg:#fff;--soft:#f5f5f5;--ink:#1e1b4b;--mute:#6b7280;--blue:#7c3aed;--blue-d:#6d28d9}
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:#fff}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
    background:#fff;color:#1e1b4b;line-height:1.55;
    min-height:100vh;display:flex;flex-direction:column;
  }
  main{flex:1;max-width:820px;width:100%;margin:0 auto;padding:36px 20px}
  #ms-footer{width:100%}

  .back{
    display:inline-flex;align-items:center;gap:8px;text-decoration:none;
    color:#6d28d9;font-weight:700;font-size:14px;margin-bottom:20px;
    padding:7px 14px;border-radius:20px;border:1px solid #ddd6fe;background:#fff;
  }
  .back:hover{background:#f5f3ff}
  h1{font-size:28px;color:#6d28d9;margin-bottom:8px;font-weight:800}
  .sub{color:#6b7280;margin-bottom:26px;font-size:14.5px}

  .box{background:#f5f3ff;border:2px solid #ddd6fe;border-radius:20px;padding:26px}
  .box label{display:block;font-size:13.5px;font-weight:700;color:#5b21b6;margin-bottom:10px}
  .box input{
    width:100%;padding:14px 16px;border:2px solid #ddd6fe;border-radius:12px;
    font-size:15px;background:#fff;color:#1e1b4b;outline:none;font-family:inherit;
  }
  .box input:focus{border-color:#7c3aed;box-shadow:0 0 0 4px rgba(124,58,237,.12)}
  .bar{height:12px;background:#ede9fe;border-radius:99px;overflow:hidden;margin-top:18px}
  .bar i{display:block;height:100%;width:0;background:#7c3aed;transition:.3s;border-radius:99px}
  .label{font-weight:800;font-size:15px;margin-top:12px;color:#6d28d9}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
  .stats div{background:#fff;border:1px solid #ddd6fe;border-radius:12px;padding:14px;text-align:center}
  .stats b{display:block;font-size:22px;color:#7c3aed;font-weight:800}
  .stats span{font-size:11.5px;color:#6b7280;letter-spacing:.3px;text-transform:uppercase}
  .checks{margin-top:20px;display:flex;flex-direction:column;gap:9px}
  .checks div{display:flex;align-items:center;gap:10px;font-size:13.5px;color:#6b7280}
  @media(max-width:600px){.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<div id="site-topbar"></div>

<main>
  <a class="back" href="tools.html"><i class="fas fa-arrow-left"></i> All Tools</a>

  <h1>🔐 Password Strength Checker</h1>
  <p class="sub">See how strong your password is — nothing is sent to any server.</p>

  <div class="box">
    <label for="psInput">Enter Password</label>
    <input type="text" id="psInput" placeholder="Type a password..." autocomplete="off" spellcheck="false">

    <div class="bar"><i id="psBar"></i></div>
    <div class="label" id="psLabel">—</div>

    <div class="stats">
      <div><b id="psLen">0</b><span>Length</span></div>
      <div><b id="psEnt">0</b><span>Entropy</span></div>
      <div><b id="psCrack">—</b><span>Crack Time</span></div>
    </div>

    <div class="checks">
      <div id="c1"><i class="fas fa-circle-check"></i> At least 12 characters</div>
      <div id="c2"><i class="fas fa-circle-check"></i> Uppercase letters (A–Z)</div>
      <div id="c3"><i class="fas fa-circle-check"></i> Lowercase letters (a–z)</div>
      <div id="c4"><i class="fas fa-circle-check"></i> Numbers (0–9)</div>
      <div id="c5"><i class="fas fa-circle-check"></i> Special symbols (!@#$…)</div>
    </div>
  </div>
</main>

<div id="ms-footer"></div>

<script src="top-bar.js"></script>
<script src="site-footer.js"></script>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const inp=$("psInput"),bar=$("psBar"),lbl=$("psLabel");
  const len=$("psLen"),ent=$("psEnt"),ck=$("psCrack");
  const chk=[$("c1"),$("c2"),$("c3"),$("c4"),$("c5")];

  const time=s=>{
    if(s<1)return"Instant";
    const u=[["year",31557600],["day",86400],["hour",3600],["min",60],["sec",1]];
    for(const[n,sec]of u)if(s>=sec){const v=s/sec;return `${v<10?v.toFixed(1):Math.round(v)} ${n}${v>=2?"s":""}`;}
    return"< 1 sec";
  };
  const setC=(el,ok)=>{
    el.style.color=ok?"#7c3aed":"#9ca3af";
    el.querySelector("i").className=ok?"fas fa-circle-check":"far fa-circle";
  };
  const run=()=>{
    const p=inp.value,L=p.length;
    len.textContent=L;
    const u=/[A-Z]/.test(p),l=/[a-z]/.test(p),n=/[0-9]/.test(p),s=/[^A-Za-z0-9]/.test(p);
    setC(chk[0],L>=12);setC(chk[1],u);setC(chk[2],l);setC(chk[3],n);setC(chk[4],s);
    let pool=0;
    if(l)pool+=26;if(u)pool+=26;if(n)pool+=10;if(s)pool+=33;
    if(!pool)pool=1;
    const e=L?Math.round(L*Math.log2(pool)):0;
    ent.textContent=e;
    ck.textContent=L?time(Math.pow(2,e)/2/1e10):"—";
    let sc=0;
    if(L>=8)sc++;if(L>=12)sc++;if(L>=16)sc++;if(u&&l)sc++;if(n)sc++;if(s)sc++;
    let pct=0,col="#dc2626",t="Very Weak";
    if(!L){pct=0;t="—";col="#9ca3af";}
    else if(sc<=1){pct=15;t="Very Weak";col="#dc2626";}
    else if(sc===2){pct=35;t="Weak";col="#f97316";}
    else if(sc===3){pct=55;t="Fair";col="#eab308";}
    else if(sc===4){pct=75;t="Good";col="#22c55e";}
    else if(sc===5){pct=90;t="Strong";col="#16a34a";}
    else{pct=100;t="Very Strong";col="#15803d";}
    bar.style.width=pct+"%";bar.style.background=col;
    lbl.textContent=L?`${t}  •  Score ${sc}/6`:"—";
    lbl.style.color=col;
  };
  inp.addEventListener("input",run);run();
})();
</script>
</body>
</html>
